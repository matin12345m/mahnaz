<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4A0613">
<title>cackloris · افتتاح</title>

<!-- فونت آنلاین (اختیاری). اگه اینترنت نباشه این خط نادیده گرفته می‌شه و فونت‌های جایگزین استفاده می‌شن -->
<link rel="stylesheet" media="print" onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700&family=Playfair+Display:ital,wght@1,500;1,600&display=swap">

<style>
/* =====================================================================
   برای اجرای کاملاً آفلاین با فونت وزیرمتن:
   فایل‌های فونت رو کنار index.html بذارید و این بخش رو از کامنت خارج کنید.
   ---------------------------------------------------------------------
@font-face{font-family:'Vazirmatn';src:url('Vazirmatn-Light.woff2') format('woff2');font-weight:300;font-display:swap}
@font-face{font-family:'Vazirmatn';src:url('Vazirmatn-Regular.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Vazirmatn';src:url('Vazirmatn-Bold.woff2') format('woff2');font-weight:700;font-display:swap}
   ===================================================================== */

/* ---------- پالت و متغیرها ---------- */
:root{
  --burgundy:#800D22; --burgundy-2:#9E1A31; --burgundy-deep:#4A0613;
  --cream:#FFF0D8; --gold:#C99A4A; --gold-l:#E8C987; --milk:#FFFAF2; --brown:#6B4A3A;
  --fa:'Vazirmatn','Vazir','IRANSansX','IRANSans','Estedad','Shabnam','Sahel','Segoe UI',Tahoma,sans-serif;
  --la:'Playfair Display','Didot','Bodoni 72','Bodoni MT',Georgia,'Times New Roman',serif;
  --u:3.9px;          /* یک درصد عرض صحنه (با JS تنظیم می‌شه) */
  --sw:100vw; --sh:100vh;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#1d0409}
body{
  display:flex;align-items:center;justify-content:center;
  font-family:var(--fa);color:var(--burgundy);
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
::-webkit-scrollbar{display:none}
button{font:inherit;border:none;background:none;cursor:pointer;color:inherit}
.ltr{direction:ltr;unicode-bidi:isolate}

/* پس‌زمینه بیرون صحنه (برای دسکتاپ) */
.backdrop{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 40%,#5a0a1a 0%,#2a050c 55%,#120204 100%)}

/* ---------- صحنه اصلی 9:16 ---------- */
#stage{
  position:relative;width:var(--sw);height:var(--sh);overflow:hidden;isolation:isolate;
  box-shadow:0 0 calc(var(--u)*20) rgba(0,0,0,.6);
}

/* ---------- لایه‌های پس‌زمینه (با هم Crossfade می‌شن) ---------- */
#bgs{position:absolute;inset:0;z-index:0;isolation:isolate}
.bg{position:absolute;inset:0;opacity:0;transition:opacity 2.2s ease}
.bg.on{opacity:1}
#bg-intro{background:radial-gradient(120% 80% at 50% 38%,#a01a33 0%,#800D22 30%,#4A0613 72%,#25030a 100%)}
#bg-story{background:
  radial-gradient(70% 40% at 0% 100%,rgba(128,13,34,.30),transparent 70%),
  radial-gradient(70% 40% at 100% 0%,rgba(128,13,34,.24),transparent 70%),
  radial-gradient(110% 70% at 50% 45%,#FFFAF2 0%,#FFF0D8 45%,#f3d9b4 80%,#e2b493 100%)}
#bg-night{background:radial-gradient(100% 70% at 50% 50%,#5c0a1b 0%,#3a0510 55%,#1a0206 100%)}
#bg-dawn{background:
  radial-gradient(80% 45% at 50% 70%,rgba(255,214,140,.75),transparent 70%),
  radial-gradient(110% 70% at 50% 50%,#FFFAF2 0%,#FFF0D8 45%,#f1cfa0 80%,#c9798a 120%)}
#bg-light{background:radial-gradient(110% 70% at 50% 35%,#ffffff 0%,#FFFAF2 40%,#FFF0D8 75%,#f0d8ba 100%)}
#bg-reveal{background:radial-gradient(75% 48% at 50% 40%,#a8203a 0%,#800D22 35%,#4A0613 72%,#1d0207 100%)}

/* هاله‌های نور شناور (بوکه) */
.bokeh{position:absolute;inset:0;z-index:1;pointer-events:none;opacity:.75;transition:opacity 2s}
.bokeh span{position:absolute;border-radius:50%;
  background:radial-gradient(circle,rgba(232,201,135,.32) 0%,rgba(232,201,135,.08) 40%,transparent 68%)}
.bokeh span:nth-child(1){width:calc(var(--u)*90);height:calc(var(--u)*90);left:-30%;top:-10%;animation:drift1 22s ease-in-out infinite alternate}
.bokeh span:nth-child(2){width:calc(var(--u)*70);height:calc(var(--u)*70);right:-25%;top:30%;animation:drift2 26s ease-in-out infinite alternate}
.bokeh span:nth-child(3){width:calc(var(--u)*80);height:calc(var(--u)*80);left:-10%;bottom:-20%;animation:drift1 30s ease-in-out infinite alternate-reverse}
.bokeh span:nth-child(4){width:calc(var(--u)*50);height:calc(var(--u)*50);right:5%;top:-8%;animation:drift2 18s ease-in-out infinite alternate-reverse}
@keyframes drift1{to{transform:translate(calc(var(--u)*25),calc(var(--u)*18)) scale(1.15)}}
@keyframes drift2{to{transform:translate(calc(var(--u)*-20),calc(var(--u)*-25)) scale(.9)}}

/* پرتوهای نور نرم برای صحنه پیام */
#raysSoft{position:absolute;z-index:2;left:50%;top:34%;width:calc(var(--u)*230);height:calc(var(--u)*230);
  margin:calc(var(--u)*-115) 0 0 calc(var(--u)*-115);pointer-events:none;opacity:0;transition:opacity 2.5s;
  background:repeating-conic-gradient(from 0deg,rgba(232,201,135,.22) 0deg 5deg,transparent 5deg 15deg);
  -webkit-mask:radial-gradient(circle,#000 0%,transparent 58%);mask:radial-gradient(circle,#000 0%,transparent 58%);
  animation:spin 90s linear infinite}
#stage[data-scene="msg"] #raysSoft{opacity:.8}
#stage[data-scene="msg"] .bokeh,#stage[data-scene="story"] .bokeh{opacity:.5}

/* ---------- صحنه‌ها ---------- */
.scene{position:absolute;inset:0;z-index:3;opacity:0;visibility:hidden;
  transition:opacity 1.2s ease,visibility 0s linear 1.2s}
.scene.active{opacity:1;visibility:visible;transition:opacity 1.2s ease,visibility 0s}
.px{will-change:transform}
.w{display:inline-block;opacity:0;will-change:transform,opacity,filter}
.w.latin{font-family:var(--la);font-style:italic;direction:ltr}
.gold{background:linear-gradient(100deg,#b8873a 0%,#f6dfa8 40%,#C99A4A 60%,#f7e6bd 85%);
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}

/* کانوس ذرات، فلش انتقال، وینیت و گرین فیلم */
#fx{position:absolute;inset:0;width:100%;height:100%;z-index:5;pointer-events:none}
#flash{position:absolute;inset:0;z-index:6;pointer-events:none;opacity:0}
.vignette{position:absolute;inset:0;z-index:7;pointer-events:none;
  background:radial-gradient(120% 90% at 50% 50%,transparent 55%,rgba(40,0,10,.38) 100%)}
.grain{position:absolute;inset:-50%;z-index:8;pointer-events:none;opacity:.07;mix-blend-mode:soft-light;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  animation:grain 1s steps(6) infinite}
@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-3%,2%)}40%{transform:translate(2%,-3%)}60%{transform:translate(-2%,-1%)}80%{transform:translate(3%,3%)}100%{transform:translate(0,0)}}
@keyframes spin{to{transform:rotate(360deg)}}

/* =====================================================================
   صحنه ۱: دعوت
   ===================================================================== */
.intro-inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:calc(var(--u)*4)}
.top-cap{position:absolute;top:7.5%;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:calc(var(--u)*3);
  font-family:var(--la);font-style:italic;font-size:calc(var(--u)*3);letter-spacing:calc(var(--u)*.9);color:var(--gold-l);opacity:0}
.top-cap i{display:block;width:calc(var(--u)*12);height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
.top-cap i:last-child{transform:scaleX(-1)}

.logo-stage{position:relative;width:calc(var(--u)*60);height:calc(var(--u)*60)}
.flare{position:absolute;left:50%;top:50%;width:calc(var(--u)*150);height:calc(var(--u)*1);
  margin:calc(var(--u)*-.5) 0 0 calc(var(--u)*-75);opacity:0;pointer-events:none;
  background:linear-gradient(90deg,transparent 0%,rgba(255,226,170,.15) 20%,rgba(255,244,220,.95) 50%,rgba(255,226,170,.15) 80%,transparent 100%);
  box-shadow:0 0 calc(var(--u)*3) rgba(255,220,150,.8)}
.flare::after{content:"";position:absolute;left:50%;top:50%;width:calc(var(--u)*24);height:calc(var(--u)*24);
  margin:calc(var(--u)*-12) 0 0 calc(var(--u)*-12);border-radius:50%;
  background:radial-gradient(circle,rgba(255,250,235,.95),rgba(255,210,140,.35) 35%,transparent 70%)}
.logo-wrap{position:absolute;inset:0;display:grid;place-items:center;opacity:0}
.logo-halo{position:absolute;inset:-18%;border-radius:50%;
  background:radial-gradient(circle,rgba(232,201,135,.42),rgba(201,154,74,.12) 45%,transparent 68%);
  animation:halo 5s ease-in-out infinite}
@keyframes halo{50%{transform:scale(1.08);opacity:.75}}
.logo-ring{position:absolute;inset:-6%;width:112%;height:112%;animation:spin 48s linear infinite;direction:ltr}
.logo-img{position:relative;width:70%;height:70%;object-fit:contain;
  filter:drop-shadow(0 calc(var(--u)*1.5) calc(var(--u)*3) rgba(0,0,0,.35))}
.logo-wrap.round .logo-img{border-radius:50%;object-fit:cover;box-shadow:0 0 0 calc(var(--u)*.6) var(--gold),0 calc(var(--u)*2) calc(var(--u)*6) rgba(0,0,0,.4)}
.logo-fallback{position:relative;width:70%;height:70%;border-radius:50%;display:none;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(circle at 40% 35%,#FFFAF2,#FFF0D8 70%,#f2d9b2);
  box-shadow:0 0 0 calc(var(--u)*.5) var(--gold),0 0 0 calc(var(--u)*1.4) rgba(255,240,216,.35),0 calc(var(--u)*2) calc(var(--u)*6) rgba(0,0,0,.4)}
.logo-fallback b{font-family:var(--la);font-style:italic;font-weight:600;font-size:calc(var(--u)*7.4);color:var(--burgundy);direction:ltr}
.logo-fallback small{font-size:calc(var(--u)*2.8);color:var(--gold);margin-top:calc(var(--u)*.6)}

.intro-text{margin-top:calc(var(--u)*7);font-size:calc(var(--u)*6);font-weight:300;color:var(--cream);text-align:center;padding:0 calc(var(--u)*8);
  text-shadow:0 0 calc(var(--u)*4) rgba(232,201,135,.45)}
.ornament{display:block;width:calc(var(--u)*42);margin-top:calc(var(--u)*3);opacity:0}

.cta-wrap{position:relative;margin-top:calc(var(--u)*8);opacity:0;pointer-events:none}
.cta-wrap.ready{pointer-events:auto}
.cta-wrap::before,.cta-wrap::after{content:"";position:absolute;inset:calc(var(--u)*-1.2);border-radius:999px;
  border:1px solid rgba(232,201,135,.6);animation:ringOut 2.8s ease-out infinite;pointer-events:none}
.cta-wrap::after{animation-delay:1.4s}
@keyframes ringOut{0%{transform:scale(.95);opacity:.9}100%{transform:scale(1.35,1.6);opacity:0}}
.cta{position:relative;overflow:hidden;display:block;
  font-size:calc(var(--u)*4.9);font-weight:700;color:var(--burgundy-deep);
  padding:calc(var(--u)*3.4) calc(var(--u)*10);border-radius:999px;
  background:linear-gradient(135deg,#f8e7bd 0%,#E8C987 30%,#C99A4A 62%,#f3dca6 100%);background-size:220% 220%;
  box-shadow:0 0 0 calc(var(--u)*.4) rgba(255,240,216,.45),0 calc(var(--u)*1.6) calc(var(--u)*5) rgba(0,0,0,.35),0 0 calc(var(--u)*7) rgba(232,201,135,.45);
  animation:ctaBg 6s ease infinite;
  transition:transform .45s cubic-bezier(.34,1.56,.64,1),box-shadow .45s}
.cta::before{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.75),transparent);transform:skewX(-20deg);
  animation:sweep 3.2s ease-in-out infinite}
.cta:hover{transform:translateY(-3px) scale(1.06);
  box-shadow:0 0 0 calc(var(--u)*.5) rgba(255,240,216,.7),0 calc(var(--u)*2.4) calc(var(--u)*6) rgba(0,0,0,.4),0 0 calc(var(--u)*12) rgba(232,201,135,.75)}
.cta:active{transform:scale(.95);transition-duration:.12s}
.cta-label{position:relative;z-index:1}
@keyframes ctaBg{50%{background-position:100% 100%}}
@keyframes sweep{0%,55%{left:-60%}100%{left:130%}}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.65);pointer-events:none;transform:scale(0)}

/* =====================================================================
   صحنه ۲: داستان
   ===================================================================== */
.story-inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.chapter{position:absolute;top:9%;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:calc(var(--u)*3);
  font-family:var(--la);font-style:italic;font-size:calc(var(--u)*3.2);letter-spacing:calc(var(--u)*1);color:var(--gold);opacity:0;transition:color 1.5s}
.chapter i{display:block;width:calc(var(--u)*10);height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
.chapter i:last-child{transform:scaleX(-1)}
.line{position:relative;font-size:calc(var(--u)*6.6);line-height:1.95;font-weight:500;text-align:center;
  padding:0 calc(var(--u)*9);color:var(--burgundy);transition:color 1.6s,text-shadow 1.6s;
  text-shadow:0 calc(var(--u)*.4) calc(var(--u)*2.5) rgba(255,250,242,.6)}
#sc-story.night .line{color:var(--cream);text-shadow:0 0 calc(var(--u)*4) rgba(0,0,0,.5)}
#sc-story.night .chapter{color:var(--gold-l)}
.line.glow{text-shadow:0 0 calc(var(--u)*5) rgba(232,180,90,.75),0 0 calc(var(--u)*1.2) rgba(255,250,242,.9)}
.caret{display:inline-block;width:.07em;height:1.05em;margin-inline-start:.1em;vertical-align:-.18em;border-radius:2px;
  background:var(--gold);box-shadow:0 0 8px rgba(201,154,74,.8);animation:blink .85s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.story-orn{position:absolute;bottom:22%;left:50%;width:calc(var(--u)*44);margin-left:calc(var(--u)*-22);opacity:0}

/* =====================================================================
   صحنه ۳: پیام
   ===================================================================== */
.msg-inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:calc(var(--u)*2)}
.cake-wrap{width:calc(var(--u)*66);opacity:0}
.cake{display:block;width:100%;height:auto;overflow:visible}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick 1.6s ease-in-out infinite}
.flame-glow{animation:glowP 2s ease-in-out infinite}
@keyframes flick{0%,100%{transform:scale(1,1) skewX(0)}25%{transform:scale(.92,1.08) skewX(3deg)}50%{transform:scale(1.04,.94) skewX(-2deg)}75%{transform:scale(.96,1.05) skewX(2deg)}}
@keyframes glowP{50%{opacity:.6}}
.tw{transform-box:fill-box;transform-origin:center;animation:tw 2.4s ease-in-out infinite}
@keyframes tw{0%,100%{transform:scale(.3) rotate(0);opacity:.2}50%{transform:scale(1) rotate(45deg);opacity:1}}

.msg-texts{position:relative;width:100%;height:calc(var(--u)*36);margin-top:calc(var(--u)*2)}
.msg-group{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*1.5);padding:0 calc(var(--u)*7)}
.msg-line{font-size:calc(var(--u)*5.6);line-height:1.8;text-align:center;font-weight:400;color:var(--brown)}
.msg-line.strong{color:var(--burgundy);font-weight:500}
.msg-line.big{font-size:calc(var(--u)*7.4);font-weight:700;color:var(--burgundy)}
.msg-line.beat{animation:beatTxt 1.8s ease-in-out infinite}
@keyframes beatTxt{0%,100%{transform:scale(1)}15%{transform:scale(1.04)}30%{transform:scale(1)}45%{transform:scale(1.03)}}

.heart-wrap{position:relative;width:calc(var(--u)*19);height:calc(var(--u)*19);margin-top:calc(var(--u)*2);opacity:0}
.heart-btn{position:relative;z-index:1;width:100%;height:100%;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 30%,#FFFAF2,#FFF0D8 70%,#f1d7ae);
  box-shadow:0 0 0 calc(var(--u)*.5) var(--gold),0 calc(var(--u)*1.6) calc(var(--u)*4.5) rgba(128,13,34,.25);
  transition:background .5s,transform .3s}
.heart-btn:hover{transform:scale(1.07)}
.heart-btn svg{width:52%;height:52%;fill:none;stroke:var(--burgundy);stroke-width:1.6;transition:fill .4s,stroke .4s;animation:hb 1.4s ease-in-out infinite}
.heart-btn.liked{background:radial-gradient(circle at 35% 30%,#b3253f,#800D22 65%,#5e0918)}
.heart-btn.liked svg{fill:var(--cream);stroke:var(--cream)}
@keyframes hb{0%,100%{transform:scale(1)}14%{transform:scale(1.16)}28%{transform:scale(1)}42%{transform:scale(1.1)}}
.heart-ring{position:absolute;inset:0;border-radius:50%;border:2px solid var(--burgundy);opacity:0;pointer-events:none}

/* =====================================================================
   صحنه ۴: رونمایی
   ===================================================================== */
.box-rays{position:absolute;left:50%;top:40%;width:calc(var(--u)*240);height:calc(var(--u)*240);
  margin:calc(var(--u)*-120) 0 0 calc(var(--u)*-120);opacity:0;pointer-events:none}
.box-rays::before{content:"";position:absolute;inset:0;
  background:repeating-conic-gradient(from 0deg,rgba(255,224,160,.20) 0deg 6deg,transparent 6deg 17deg);
  -webkit-mask:radial-gradient(circle,#000 0%,transparent 58%);mask:radial-gradient(circle,#000 0%,transparent 58%);
  animation:spin 70s linear infinite}

.card-pos{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);z-index:3}
.card{position:relative;opacity:0;padding:calc(var(--u)*1.3);border-radius:calc(var(--u)*4.4);
  background:linear-gradient(145deg,#f8e6bb 0%,#C99A4A 35%,#f3dca6 58%,#a77a33 100%);
  box-shadow:0 calc(var(--u)*4) calc(var(--u)*10) rgba(0,0,0,.5),0 0 calc(var(--u)*14) rgba(232,201,135,.35)}
.card img{display:block;width:auto;height:auto;max-width:calc(var(--u)*80);max-height:calc(var(--sh)*0.54);
  border-radius:calc(var(--u)*3.2);background:#fff}
.card-shine{position:absolute;inset:calc(var(--u)*1.3);border-radius:calc(var(--u)*3.2);overflow:hidden;pointer-events:none}
.card-shine::before{content:"";position:absolute;top:-20%;bottom:-20%;width:35%;left:-60%;transform:skewX(-18deg);
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent)}
.card.shine .card-shine::before{animation:cardSweep 1.8s ease-in-out forwards}
@keyframes cardSweep{to{left:140%}}

/* جایگزین تصویر اینستاگرام اگه فایل پیدا نشه */
.insta-fallback{display:none;width:auto;height:min(calc(var(--u)*112),calc(var(--sh)*0.54));aspect-ratio:9/17;
  border-radius:calc(var(--u)*3.2);background:var(--milk);padding:calc(var(--u)*4) calc(var(--u)*3);flex-direction:column;gap:calc(var(--u)*2.4);direction:ltr;overflow:hidden}
.ig-head{display:flex;align-items:center;gap:calc(var(--u)*3)}
.ig-av{width:calc(var(--u)*13);height:calc(var(--u)*13);border-radius:50%;flex:none;display:grid;place-items:center;
  background:radial-gradient(circle,#FFF0D8 60%,transparent 61%),conic-gradient(var(--gold),var(--burgundy),var(--gold));
  font-family:var(--la);font-style:italic;color:var(--burgundy);font-size:calc(var(--u)*5)}
.ig-stats{display:flex;gap:calc(var(--u)*3);font-size:calc(var(--u)*2.6);color:var(--brown);text-align:center}
.ig-stats b{display:block;font-size:calc(var(--u)*3.2);color:var(--burgundy)}
.ig-name{font-family:var(--la);font-style:italic;font-size:calc(var(--u)*4);color:var(--burgundy)}
.ig-bar{height:calc(var(--u)*1.2);border-radius:9px;background:#f0dcc0}
.ig-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:calc(var(--u)*.7);margin-top:auto}
.ig-grid i{aspect-ratio:1;border-radius:calc(var(--u)*.8);background:linear-gradient(135deg,#FFF0D8,#f0d2a6)}
.ig-grid i:nth-child(odd){background:linear-gradient(135deg,#9e1a31,#5e0918)}
.ig-note{font-family:var(--fa);direction:rtl;font-size:calc(var(--u)*2.5);color:var(--gold);text-align:center}

/* جعبه شیرینی */
.box-pos{position:absolute;left:50%;top:60%;transform:translate(-50%,-50%);z-index:4}
.box{position:relative;width:calc(var(--u)*58);height:calc(var(--u)*56);opacity:0}

<script>
/* =====================================================================
   ⚙️ تنظیمات — فقط این بخش رو تغییر بدید
   ===================================================================== */
const LOGO_IMAGE      = "logo.png";            // فایل لوگو
const LOGO_ROUND      = true;                 // اگه لوگو مربعی/دایره‌ایه و می‌خواید گرد بشه: true
const INSTAGRAM_IMAGE = "instagram-page.jpg";  // اسکرین‌شات پیج اینستاگرام
const MUSIC_FILE      = "";                    // مثلاً "music.mp3" — اگه خالی باشه، موسیقی جعبه‌موزیک داخلی پخش می‌شه
const SPEED           = 1.15;                     // ضریب سرعت کل داستان (۱ = عادی، ۱.۲ = کندتر)

/* متن‌ها */
const TXT = {
  intro: "هر قصه شیرینی، یه شروع داره...",
  story: [
    "ما تازه شروع کردیم...",
    "شاید شروع کردن تو این روزها آسون نباشه...",
    "وسط این همه جنگ، گرونی و سختی...",
    "اما هنوز به رویاهای کوچیکمون امید داریم.",
    "ما تصمیم گرفتیم با عشق، یه گوشه کوچیک از دنیا رو شیرین‌تر کنیم... ❤️"
  ],
  m1: "شاید هنوز خیلی کوچیک باشیم...",
  m2: "اما برای بزرگ شدن، به همراهی شما نیاز داریم.",
  m3: "پس اگه ما رو می‌بینی...",
  m4: "لایک و فالو یادت نره! 🥹❤️",
  w1: "به دنیای شیرین cackloris خوش اومدی ❤️",
  w2: "اینجا قراره کلی اتفاق شیرین بیفته..."
};

/* =====================================================================
   ابزارهای پایه
   ===================================================================== */
const $ = s => document.querySelector(s);
const stage = $('#stage');
const EASE = 'cubic-bezier(.22,1,.36,1)';
let RUN = 0;                          // شناسه اجرا؛ با Replay عوض می‌شه تا تایم‌لاین قبلی متوقف بشه
const CANCEL = {};

function sleep(ms){
  const id = RUN;
  return new Promise((res, rej) => setTimeout(() => id === RUN ? res() : rej(CANCEL), ms * SPEED));
}
function anim(el, kf, o = {}){
  if(!el) return Promise.resolve();
  const a = el.animate(kf, Object.assign({duration:1000, easing:EASE, fill:'forwards'}, o));
  return a.finished.catch(() => {});
}
function U(){ return parseFloat(getComputedStyle(stage).getPropertyValue('--u')) || 4; }

/* ---------- اندازه صحنه 9:16 ---------- */
function layout(){
  const W = innerWidth, H = innerHeight;
  let sw, sh;
  if (W / H < 0.62) { sw = W; sh = H; }            // موبایل عمودی: تمام‌صفحه
  else { sh = H; sw = Math.round(H * 9 / 16); }    // دسکتاپ: قاب 9:16 در مرکز
  stage.style.setProperty('--sw', sw + 'px');
  stage.style.setProperty('--sh', sh + 'px');
  stage.style.setProperty('--u', (sw / 100) + 'px');
  FX.resize(sw, sh);
}

/* ---------- پس‌زمینه و صحنه ---------- */
function setBg(id){ document.querySelectorAll('.bg').forEach(b => b.classList.toggle('on', b.id === 'bg-' + id)); }
function setScene(id){
  stage.dataset.scene = id;
  document.querySelectorAll('.scene').forEach(s => s.classList.toggle('active', s.id === 'sc-' + id));
}

/* ---------- افکت‌های متن ---------- */
function splitWords(el, text){
  el.innerHTML = '';
  text.split(' ').forEach((t, i, arr) => {
    const s = document.createElement('span');
    s.className = 'w' + (/^[a-z]/i.test(t) ? ' latin' : '');
    s.textContent = t;
    el.appendChild(s);
    if (i < arr.length - 1) el.appendChild(document.createTextNode(' '));
  });
  return [...el.querySelectorAll('.w')];
}
/* نمایش کلمه‌به‌کلمه با محو + بلور + حرکت */
async function revealWords(el, text, {stagger = 140, dur = 1100, y = 1.8, blur = 10, scale = 1} = {}){
  const ws = splitWords(el, text), u = U();
  el.style.opacity = 1;
  ws.forEach((w, i) => anim(w,
    [{opacity:0, transform:`translateY(${y*u}px) scale(${scale})`, filter:`blur(${blur}px)`},
     {opacity:1, transform:'none', filter:'blur(0)'}],
    {duration:dur * SPEED, delay:i * stagger * SPEED}));
  await sleep(ws.length * stagger + dur);
}
/* افکت تایپ (فارسی به‌درستی متصل می‌مونه) */
async function typeText(el, text, speed = 75){

  // پاک کردن انیمیشن قبلی
  el.getAnimations().forEach(a => a.cancel());

  el.style.opacity = '1';
  el.style.filter = 'none';
  el.style.transform = 'none';

  el.innerHTML = '';

  const tn = document.createTextNode('');
  const caret = document.createElement('span');
  caret.className = 'caret';

  el.append(tn, caret);

  for (const ch of Array.from(text)) {
    tn.data += ch;

    await sleep(
      ch === ' '
        ? speed * 1.6
        : (/[.،,]/.test(ch) ? speed * 3 : speed)
    );
  }

  await sleep(1000);
  caret.remove();
}
async function hideEl(el, dur = 900){
  if (!el) return;

  await anim(el, [
    {opacity:1, filter:'blur(0)', transform:'none'},
    {
      opacity:0,
      filter:'blur(8px)',
      transform:'translateY(${-U()*2}px) scale(1.03)'
    }
  ], {
    duration:dur * SPEED,
    easing:'ease-in'
  });

  // پاک کردن اثر انیمیشن قبلی
  el.getAnimations().forEach(a => a.cancel());

  // ثبت حالت نهایی به صورت عادی
  el.style.opacity = '0';
  el.style.filter = 'none';
  el.style.transform = 'none';
}
function fadeIn(el, dur = 1200, from = {}){
  return anim(el, [Object.assign({opacity:0}, from), {opacity:1, transform:'none', filter:'blur(0)'}], {duration:dur * SPEED});
}
function flash(color = 'rgba(255,240,210,1)', dur = 1400){
  const f = $('#flash'); f.style.background = color;
  return anim(f, [{opacity:0},{opacity:1, offset:.25},{opacity:0}], {duration:dur, easing:'ease-out'});
}
function center(el){
  const r = el.getBoundingClientRect(), s = stage.getBoundingClientRect();
  return {x:r.left - s.left + r.width / 2, y:r.top - s.top + r.height / 2};
}

/* =====================================================================
   سیستم ذرات (گرد طلایی، قلب، جرقه)
   ===================================================================== */
const FX = (() => {
  const cv = $('#fx'), ctx = cv.getContext('2d');
  let W = 0, H = 0, dpr = 1, parts = [], ambient = 'gold', last = performance.now();
  const COLORS = {gold:['#E8C987','#C99A4A','#f7e6bd','#fff3d4'], burg:['#800D22','#9E1A31','#C99A4A']};

  function resize(w, h){
    dpr = Math.min(devicePixelRatio || 1, 2); W = w; H = h;
    cv.width = w * dpr; cv.height = h * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function rnd(a, b){ return a + Math.random() * (b - a); }
  function spawnDust(){
    const pal = ambient === 'burg' ? COLORS.burg : COLORS.gold;
    parts.push({t:'dust', x:rnd(0, W), y:H + 10, vx:rnd(-.15, .15), vy:rnd(-.25, -.7), r:rnd(.6, 2.2) * W / 400,
      life:0, max:rnd(7, 13), c:pal[Math.random() * pal.length | 0], ph:rnd(0, 6)});
  }
  function burst(x, y, n = 40, kind = 'spark', spread = 1){
    for (let i = 0; i < n; i++) {
      const a = rnd(0, Math.PI * 2), sp = rnd(1, 5) * spread * W / 400;
      parts.push({t:kind, x, y, vx:Math.cos(a) * sp, vy:Math.sin(a) * sp - (kind === 'heart' ? 1.2 : 0),
        r:(kind === 'heart' ? rnd(5, 11) : rnd(1, 2.6)) * W / 400, life:0, max:rnd(1.4, 2.8),
        c:kind === 'heart' ? (Math.random() < .6 ? '#9E1A31' : '#C99A4A') : COLORS.gold[Math.random() * 4 | 0], rot:rnd(-.5, .5), ph:0});
    }
  }
  function floatHearts(n = 12){
    for (let i = 0; i < n; i++) setTimeout(() => parts.push({t:'heart', x:rnd(W * .1, W * .9), y:H + 20, vx:rnd(-.3, .3), vy:rnd(-1, -1.8) * W / 400,
      r:rnd(5, 12) * W / 400, life:0, max:rnd(5, 8), c:Math.random() < .65 ? '#9E1A31' : '#C99A4A', rot:rnd(-.4, .4), ph:rnd(0, 6), float:1}), i * 180);
  }
  function heart(x, y, s, rot){
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s / 16, s / 16);
    ctx.beginPath(); ctx.moveTo(0, 6);
    ctx.bezierCurveTo(-14, -4, -8, -16, 0, -8); ctx.bezierCurveTo(8, -16, 14, -4, 0, 6);
    ctx.fill(); ctx.restore();
  }
  function tick(now){
    const dt = Math.min((now - last) / 1000, .05); last = now;
    ctx.clearRect(0, 0, W, H);
    if (ambient && Math.random() < (ambient === 'none' ? 0 : .5)) spawnDust();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i]; p.life += dt;
      const k = p.life / p.max;
      if (k >= 1) { parts.splice(i, 1); continue; }
      p.ph += dt * 2;
      if (p.t === 'dust') { p.x += p.vx + Math.sin(p.ph) * .25; p.y += p.vy; }
      else if (p.float) { p.x += p.vx + Math.sin(p.ph) * .6; p.y += p.vy; }
      else { p.vx *= .965; p.vy = p.vy * .965 + .04; p.x += p.vx; p.y += p.vy; }
      const alpha = p.t === 'dust' ? Math.sin(k * Math.PI) * (.55 + .45 * Math.sin(p.ph * 3)) : (1 - k);
      ctx.globalAlpha = Math.max(alpha, 0); ctx.fillStyle = p.c;
      if (p.t === 'heart') {
        ctx.globalCompositeOperation = 'source-over';
        heart(p.x, p.y, p.r * 2, p.rot + Math.sin(p.ph) * .2);
        ctx.globalCompositeOperation = 'lighter';
      } else {
        ctx.shadowBlur = p.r * 5; ctx.shadowColor = p.c;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
        ctx.shadowBlur = 0;
      }
    }
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
  return {resize, burst, floatHearts, setAmbient:m => ambient = m, clear:() => parts = []};
})();

/* =====================================================================
   موسیقی (فقط بعد از تعامل کاربر)
   ===================================================================== */
const Music = (() => {
  let ctx, master, timer, audioEl, on = false, step = 0, next = 0;
  // جعبه‌موزیک ملایم: آکوردهای C - Am - F - G
  const prog = [[60,64,67,72],[57,60,64,69],[53,57,60,65],[55,59,62,67]];
  const f = m => 440 * Math.pow(2, (m - 69) / 12);
  function note(m, t, v = .12, d = 2.4, type = 'sine'){
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.value = f(m);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + d + .1);
  }
  function schedule(){
    while (next < ctx.currentTime + .6) {
      const ch = prog[Math.floor(step / 8) % 4], i = step % 8;
      const pat = [0,2,1,3,2,1,3,2];
      note(ch[pat[i]] + 12, next, .07, 2.2);
      if (i === 0) { note(ch[0] - 12, next, .09, 4, 'triangle'); note(ch[1], next, .03, 4); }
      next += .42; step++;
    }
  }
  function start(){
    if (MUSIC_FILE) {
      if (!audioEl) { audioEl = new Audio(MUSIC_FILE); audioEl.loop = true; audioEl.volume = .6; }
      audioEl.play().catch(() => {});
    } else {
      try {
        if (!ctx) {
          ctx = new (window.AudioContext || window.webkitAudioContext)();
          master = ctx.createGain(); master.gain.value = 0;
          const fb = ctx.createDelay(); fb.delayTime.value = .32;
          const fg = ctx.createGain(); fg.gain.value = .3;
          master.connect(ctx.destination); master.connect(fb); fb.connect(fg); fg.connect(fb); fg.connect(ctx.destination);
        }
        ctx.resume(); next = ctx.currentTime + .1;
        master.gain.cancelScheduledValues(ctx.currentTime);
        master.gain.linearRampToValueAtTime(.9, ctx.currentTime + 2);
        clearInterval(timer); timer = setInterval(schedule, 150);
      } catch (e) {}
    }
    on = true; $('#sndBtn').classList.add('playing');
  }
  function stop(){
    if (audioEl) audioEl.pause();
    if (ctx) { master.gain.linearRampToValueAtTime(0, ctx.currentTime + .6); setTimeout(() => { if (!on) clearInterval(timer); }, 700); }
    on = false; $('#sndBtn').classList.remove('playing');
  }
  return {start, stop, toggle:() => on ? stop() : start(), get on(){ return on; }};
})();

  await sleep(600);

  await sleep(2200);
  await hideEl(L, 1400);

  await revealWords(L, TXT.story[4], {
    stagger:110,
    dur:1500,
    y:2,

  anim($('#storyOrn'), [

  const c = center(L);

/* ریست کامل برای اجرای مجدد */
function resetAll(){
  RUN++;
  stage.getAnimations({subtree:true}).forEach(a => {
    const isCss = (typeof CSSAnimation !== 'undefined' && a instanceof CSSAnimation) || (typeof CSSTransition !== 'undefined' && a instanceof CSSTransition);
    if (!isCss) a.cancel();
  });
  ['#introText','#storyLine','#m1','#m2','#m3','#m4','#w1','#w2'].forEach(s => { const e = $(s); e.innerHTML = ''; e.style.opacity = ''; });
  $('#m4').classList.remove('beat');
  $('#heartBtn').classList.remove('liked');
  $('#card').classList.remove('shine');
  $('#sc-story').classList.remove('night');
  $('#storyLine').classList.remove('glow');
  $('#ctaWrap').classList.remove('ready');
  $('#replayBtn').classList.remove('ready');
  FX.clear();
}

let started = false;
$('#startBtn').addEventListener('click', async e => {
  if (started) return; started = true;
  const btn = e.currentTarget, r = btn.getBoundingClientRect();
  // افکت موج کلیک
  const rp = document.createElement('span'); rp.className = 'ripple';
  const size = Math.max(r.width, r.height) * 2;
  rp.style.cssText = `width:${size}px;height:${size}px;left:${e.clientX - r.left - size/2}px;top:${e.clientY - r.top - size/2}px`;
  btn.appendChild(rp);
  rp.animate([{transform:'scale(0)', opacity:.8}, {transform:'scale(1)', opacity:0}], {duration:700, easing:'ease-out'}).onfinish = () => rp.remove();
  if (musicWanted) Music.start();
  const c = center(btn); FX.burst(c.x, c.y, 70, 'spark', 1.4);
  $('#ctaWrap').classList.remove('ready');
  // انتقال سینمایی: زوم به داخل لوگو + فلش طلایی
  const inner = $('#sc-intro .intro-inner');
  anim(inner, [{transform:'scale(1)', filter:'blur(0)', opacity:1}, {transform:'scale(1.6)', filter:'blur(12px)', opacity:0}], {duration:1500, easing:'cubic-bezier(.7,0,.3,1)'});
  anim($('#topCap'), [{opacity:1}, {opacity:0}], {duration:800});
  await new Promise(r => setTimeout(r, 900));
  flash('rgba(255,240,216,1)', 1600);
  await new Promise(r => setTimeout(r, 400));
  playStory();
});

/* ---------- پارالاکس نرم (ماوس یا ژیروسکوپ) ---------- */
(() => {
  let tx = 0, ty = 0, cx = 0, cy = 0;
  const els = [...document.querySelectorAll('.px')];
  addEventListener('pointermove', e => { tx = (e.clientX / innerWidth - .5) * 2; ty = (e.clientY / innerHeight - .5) * 2; });
  addEventListener('deviceorientation', e => { if (e.gamma != null) { tx = Math.max(-1, Math.min(1, e.gamma / 30)); ty = Math.max(-1, Math.min(1, (e.beta - 45) / 30)); } });
  (function loop(){
    cx += (tx - cx) * .05; cy += (ty - cy) * .05;
    els.forEach(el => { const d = +el.dataset.depth || 10; el.style.transform = `translate3d(${-cx * d}px,${-cy * d}px,0)`; });
    requestAnimationFrame(loop);
  })();
})();

(() => {

  if (LOGO_ROUND) $('#logoWrap').classList.add('round');
  li.onerror = () => { li.style.display = 'none'; $('#logoFallback').style.display = 'flex'; };
  li.src = LOGO_IMAGE;
  const ii = $('#instaImg');
  ii.onerror = () => { ii.style.display = 'none'; $('#instaFallback').style.display = 'flex'; };
  ii.src = INSTAGRAM_IMAGE;
  // زوم نرم عکس پیج با کلیک
ii.style.cursor = 'pointer';
ii.style.transform = 'scale(1)';
ii.style.transition =
  'transform 1.4s cubic-bezier(.22,1,.36,1)';

ii.addEventListener('click', () => {
  const zoomed = ii.dataset.zoomed === 'true';

  ii.style.transform = zoomed
    ? 'scale(1)'
    : 'scale(1.50)';

  ii.dataset.zoomed = zoomed ? 'false' : 'true';
});
})();

/* ---------- شروع ---------- */
addEventListener('resize', layout);
layout();
sceneIntro().catch(() => {});
</script>
</body>
</html>
