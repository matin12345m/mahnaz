<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4A0613">
<title>cackloris · افتتاح</title>

<!-- فونت آنلاین (اختیاری). اگه اینترنت نباشه فونت‌های جایگزین استفاده می‌شن -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&family=Playfair+Display:ital,wght@1,500;1,600&display=swap">

<style>
/* =====================================================================
   برای اجرای کاملاً آفلاین با فونت وزیرمتن:
@font-face{font-family:'Vazirmatn';src:url('Vazirmatn-Regular.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Vazirmatn';src:url('Vazirmatn-Bold.woff2') format('woff2');font-weight:700;font-display:swap}
   ===================================================================== */

:root{
  --burgundy:#800D22; --burgundy-2:#9E1A31; --burgundy-deep:#4A0613;
  --cream:#FFF0D8; --gold:#C99A4A; --gold-l:#E8C987; --milk:#FFFAF2; --brown:#6B4A3A;
  --fa:'Vazirmatn','Vazir','IRANSansX','IRANSans','Estedad','Shabnam','Sahel','Segoe UI',Tahoma,sans-serif;
  --la:'Playfair Display','Didot','Bodoni 72','Bodoni MT',Georgia,'Times New Roman',serif;
  --u:3.9px; --sw:100vw; --sh:100vh;
  --ease:cubic-bezier(.22,1,.36,1);
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#1d0409;overscroll-behavior:none}
body{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--fa);color:var(--burgundy);
  -webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
::-webkit-scrollbar{display:none}
button{font:inherit;border:none;background:none;cursor:pointer;color:inherit;touch-action:manipulation}
.ltr{direction:ltr;unicode-bidi:isolate}
.backdrop{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 40%,#5a0a1a 0%,#2a050c 55%,#120204 100%)}

/* ---------- صحنه اصلی 9:16 ---------- */
#stage{position:relative;width:var(--sw);height:var(--sh);overflow:hidden;isolation:isolate;contain:layout paint size;box-shadow:0 0 calc(var(--u)*20) rgba(0,0,0,.6)}

/* ---------- پس‌زمینه‌ها (کات سریع) ---------- */
#bgs{position:absolute;inset:0;z-index:0}
.bg{position:absolute;inset:0;opacity:0;transition:opacity .35s ease}
.bg.on{opacity:1}
#bg-intro{background:radial-gradient(120% 80% at 50% 45%,#a01a33 0%,#800D22 30%,#4A0613 72%,#25030a 100%)}
#bg-show{background:radial-gradient(110% 70% at 50% 40%,#5c0a1b 0%,#3a0510 60%,#1a0206 100%)}
#bg-light{background:radial-gradient(110% 70% at 50% 35%,#ffffff 0%,#FFFAF2 40%,#FFF0D8 75%,#f0d8ba 100%)}
#bg-reveal{background:radial-gradient(75% 48% at 50% 40%,#a8203a 0%,#800D22 35%,#4A0613 72%,#1d0207 100%)}

/* ---------- صحنه‌ها ---------- */
.scene{position:absolute;inset:0;z-index:3;opacity:0;visibility:hidden;transition:opacity .3s ease,visibility 0s linear .3s}
.scene.active{opacity:1;visibility:visible;transition:opacity .3s ease,visibility 0s}
.scene:not(.active),.scene:not(.active) *{animation-play-state:paused!important}
.px{transition:transform .8s ease-out}
.w{display:inline-block;opacity:0}
.w.latin{font-family:var(--la);font-style:italic;direction:ltr}
.gold .w{background:linear-gradient(100deg,#b8873a 0%,#f6dfa8 40%,#C99A4A 60%,#f7e6bd 85%);
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}

#fx{position:absolute;inset:0;width:100%;height:100%;z-index:5;pointer-events:none}
#flash{position:absolute;inset:0;z-index:6;pointer-events:none;opacity:0}
.vignette{position:absolute;inset:0;z-index:7;pointer-events:none;opacity:.7;background:radial-gradient(120% 90% at 50% 50%,transparent 50%,rgba(30,0,8,.5) 100%)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes ringOut{0%{transform:scale(.95);opacity:.9}100%{transform:scale(1.5);opacity:0}}

/* ---------- صفحه شروع (جزو کلیپ نیست) ---------- */
.gate{position:absolute;inset:0;z-index:11;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*6);
  background:radial-gradient(120% 80% at 50% 45%,#a01a33 0%,#800D22 30%,#4A0613 72%,#25030a 100%);transition:opacity .12s,visibility 0s linear .12s}
.gate.off{opacity:0;visibility:hidden;pointer-events:none}
.play{position:relative;width:max(76px,calc(var(--u)*24));height:max(76px,calc(var(--u)*24));border-radius:50%;display:grid;place-items:center;
  background:linear-gradient(135deg,#f8e7bd 0%,#E8C987 40%,#C99A4A 100%);box-shadow:0 0 0 calc(var(--u)*.5) rgba(255,240,216,.4),0 calc(var(--u)*2) calc(var(--u)*6) rgba(0,0,0,.4)}
.play::before{content:"";position:absolute;inset:-8%;border-radius:50%;border:1px solid rgba(232,201,135,.7);animation:ringOut 2.2s ease-out infinite}
.play svg{width:36%;height:36%;margin-left:8%;fill:var(--burgundy-deep)}
.gate-t{font-size:calc(var(--u)*4.4);color:var(--gold-l)}

/* =====================================================================
   ۱) شروع انفجاری
   ===================================================================== */
.hook{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 calc(var(--u)*7)}
.hook-1{font-size:calc(var(--u)*17);font-weight:900;line-height:1.25;color:var(--cream);opacity:0;text-shadow:0 calc(var(--u)*.8) calc(var(--u)*3) rgba(0,0,0,.35)}
.hook-2{margin-top:calc(var(--u)*3);min-height:1.6em;font-size:calc(var(--u)*6.8);font-weight:500;line-height:1.6;color:var(--gold-l);text-wrap:balance}
.shock{position:absolute;left:50%;top:45%;width:calc(var(--u)*130);height:calc(var(--u)*130);margin:calc(var(--u)*-65) 0 0 calc(var(--u)*-65);
  border-radius:50%;border:calc(var(--u)*.8) solid var(--gold-l);opacity:0;pointer-events:none}
.slash{position:absolute;left:0;top:30%;width:100%;height:calc(var(--u)*.7);opacity:0;pointer-events:none;
  background:linear-gradient(90deg,transparent,var(--gold-l) 50%,transparent)}
.slash.s2{top:68%}

/* =====================================================================
   جعبه شیرینی لوکس
   ===================================================================== */
.gbox{position:relative;width:calc(var(--u)*56);height:calc(var(--u)*54)}
.gb-halo{position:absolute;left:50%;top:58%;width:calc(var(--u)*120);height:calc(var(--u)*120);margin:calc(var(--u)*-60) 0 0 calc(var(--u)*-60);
  border-radius:50%;pointer-events:none;opacity:0;transition:opacity .4s ease;
  background:radial-gradient(circle,rgba(255,226,170,.42) 0%,rgba(201,154,74,.14) 38%,transparent 64%)}
.gbox.lit .gb-halo{opacity:1}
.gb-shadow{position:absolute;left:50%;bottom:calc(var(--u)*-3.5);width:calc(var(--u)*72);height:calc(var(--u)*7);margin-left:calc(var(--u)*-36);
  background:radial-gradient(ellipse,rgba(0,0,0,.45),transparent 70%)}
.gb-body{position:absolute;left:0;bottom:0;width:100%;height:calc(var(--u)*40);border-radius:calc(var(--u)*1.4);overflow:hidden;
  background:linear-gradient(180deg,#fffaf2 0%,#FFF0D8 55%,#ecd2a8 100%);
  box-shadow:inset 0 0 0 calc(var(--u)*.45) rgba(201,154,74,.7),inset 0 calc(var(--u)*-4) calc(var(--u)*6) rgba(128,13,34,.1),0 calc(var(--u)*3) calc(var(--u)*7) rgba(0,0,0,.35)}
.gb-body::before{content:"";position:absolute;inset:calc(var(--u)*1.6);border:1px solid rgba(201,154,74,.5);border-radius:calc(var(--u)*.8)}
.rib-v{position:absolute;left:50%;top:0;bottom:0;width:calc(var(--u)*6.6);margin-left:calc(var(--u)*-3.3);
  background:linear-gradient(90deg,#5e0918,#a3182f 50%,#5e0918);box-shadow:0 0 0 1px rgba(201,154,74,.45)}
.rib-h{position:absolute;top:50%;left:0;right:0;height:calc(var(--u)*5.6);margin-top:calc(var(--u)*-2.8);
  background:linear-gradient(180deg,#5e0918,#a3182f 50%,#5e0918);box-shadow:0 0 0 1px rgba(201,154,74,.45)}
.gb-tag{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);white-space:nowrap;padding:calc(var(--u)*.9) calc(var(--u)*3.4);border-radius:99px;
  background:linear-gradient(180deg,#fffaf2,#f6e4c4);box-shadow:0 0 0 calc(var(--u)*.35) var(--gold),0 calc(var(--u)*.6) calc(var(--u)*1.6) rgba(74,6,19,.35);
  font-family:var(--la);font-style:italic;font-weight:600;font-size:calc(var(--u)*3.6);color:var(--burgundy)}
.gb-lid{position:absolute;left:calc(var(--u)*-3);bottom:calc(var(--u)*39);width:calc(var(--u)*62);height:calc(var(--u)*11);border-radius:calc(var(--u)*1.4);transform-origin:12% 100%;
  background:linear-gradient(180deg,#fffaf2,#f5e1c2);box-shadow:inset 0 0 0 calc(var(--u)*.45) rgba(201,154,74,.75),0 calc(var(--u)*1) calc(var(--u)*2.5) rgba(0,0,0,.25)}
.lid-edge{position:absolute;left:0;right:0;bottom:0;height:calc(var(--u)*1.1);border-radius:0 0 calc(var(--u)*1.4) calc(var(--u)*1.4);background:linear-gradient(90deg,#a77a33,#ecd08f 50%,#a77a33)}
.bow{position:absolute;left:50%;top:calc(var(--u)*-11.5);width:calc(var(--u)*34);margin-left:calc(var(--u)*-17)}
.bow svg{display:block;width:100%;height:auto}
.gb-seam{position:absolute;left:calc(var(--u)*1);right:calc(var(--u)*1);bottom:calc(var(--u)*39.4);height:calc(var(--u)*.8);border-radius:9px;opacity:0;
  background:#fff3d4;box-shadow:0 0 calc(var(--u)*3) calc(var(--u)*1) rgba(255,214,140,.9)}
.gbox.lit .gb-seam{animation:seam .5s ease-in-out infinite alternate}
@keyframes seam{from{opacity:.4}to{opacity:1}}
.gb-glow{position:absolute;left:50%;bottom:calc(var(--u)*33);width:calc(var(--u)*96);height:calc(var(--u)*40);margin-left:calc(var(--u)*-48);opacity:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 75%,rgba(255,242,205,.95),rgba(232,201,135,.4) 35%,transparent 70%)}
.gb-beam{position:absolute;left:50%;bottom:calc(var(--u)*40);width:calc(var(--u)*120);height:calc(var(--u)*110);margin-left:calc(var(--u)*-60);opacity:0;pointer-events:none;transform-origin:50% 100%;
  background:linear-gradient(to top,rgba(255,240,205,.85),rgba(255,220,150,.22) 50%,transparent);clip-path:polygon(40% 100%,60% 100%,100% 0,0 0)}

/* =====================================================================
   ۲) باز شدن جعبه + لوگو
   ===================================================================== */
.rays{position:absolute;left:50%;width:calc(var(--u)*230);height:calc(var(--u)*230);margin:calc(var(--u)*-115) 0 0 calc(var(--u)*-115);opacity:0;pointer-events:none}
.rays::before{content:"";position:absolute;inset:0;background:repeating-conic-gradient(from 0deg,rgba(255,224,160,.18) 0deg 6deg,transparent 6deg 17deg);
  -webkit-mask:radial-gradient(circle,#000 0%,transparent 58%);mask:radial-gradient(circle,#000 0%,transparent 58%);animation:spin 60s linear infinite}
.lite .rays::before{animation:none;-webkit-mask:none;mask:none;background:radial-gradient(circle,rgba(255,224,160,.28),transparent 55%)}
#openRays{top:33%}
.ibox-wrap{position:absolute;left:50%;top:66%;width:calc(var(--u)*56);height:calc(var(--u)*54);margin:calc(var(--u)*-27) 0 0 calc(var(--u)*-28);opacity:0;z-index:2}
.logo-pop{position:absolute;left:50%;top:33%;width:calc(var(--u)*44);height:calc(var(--u)*44);margin:calc(var(--u)*-22) 0 0 calc(var(--u)*-22);opacity:0;z-index:3}
.logo-glow{position:absolute;inset:-35%;border-radius:50%;pointer-events:none;background:radial-gradient(circle,rgba(255,226,170,.5),rgba(201,154,74,.15) 40%,transparent 65%)}
.seal{position:relative;width:100%;height:100%;display:grid;place-items:center}
.logo-ring{position:absolute;inset:-14%;width:128%;height:128%;animation:spin 30s linear infinite;direction:ltr}
.logo-img{position:relative;width:100%;height:100%;object-fit:contain;transform:scale(1.45);transform-origin:center}
.seal.round .logo-img{border-radius:50%;object-fit:cover;box-shadow:0 0 0 calc(var(--u)*.45) var(--gold),0 calc(var(--u)*1.2) calc(var(--u)*3.5) rgba(0,0,0,.35)}
.logo-fallback{position:relative;width:80%;height:80%;border-radius:50%;display:none;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(circle at 40% 35%,#FFFAF2,#FFF0D8 70%,#f2d9b2);box-shadow:0 0 0 calc(var(--u)*.45) var(--gold)}
.logo-fallback b{font-family:var(--la);font-style:italic;font-weight:600;font-size:calc(var(--u)*7);color:var(--burgundy);direction:ltr}
.logo-fallback small{font-size:calc(var(--u)*3.2);color:var(--gold)}
.open-text{position:absolute;left:0;right:0;top:64%;text-align:center;font-size:calc(var(--u)*8.4);font-weight:900;line-height:1.5;color:var(--cream);
  padding:0 calc(var(--u)*6);opacity:0;text-wrap:balance;text-shadow:0 calc(var(--u)*.6) calc(var(--u)*2.5) rgba(0,0,0,.35)}
.open-line{position:absolute;left:50%;top:75%;width:calc(var(--u)*40);height:2px;margin-left:calc(var(--u)*-20);opacity:0;
  background:linear-gradient(90deg,transparent,var(--gold-l),transparent)}

/* =====================================================================
   ۳) معرفی برند
   ===================================================================== */
.shots{position:absolute;left:calc(var(--u)*9);right:calc(var(--u)*9);top:calc(11% + var(--safe-t));height:58%;border-radius:calc(var(--u)*5);overflow:hidden;opacity:0;
  box-shadow:0 0 0 calc(var(--u)*.5) var(--gold),0 calc(var(--u)*3) calc(var(--u)*8) rgba(0,0,0,.45)}
.shot{position:absolute;inset:0;opacity:0}
.shot:nth-child(1){z-index:1;background:radial-gradient(90% 70% at 50% 40%,#a8203a,#800D22 50%,#4A0613)}
.shot:nth-child(2){z-index:2;background:radial-gradient(90% 70% at 50% 40%,#fff6e4,#f3dca6 55%,#C99A4A)}
.shot:nth-child(3){z-index:3;background:radial-gradient(90% 70% at 50% 40%,#FFFAF2,#FFF0D8 55%,#efd3aa)}
.shot-art{position:absolute;inset:0;display:grid;place-items:center}
.shot-art svg{width:80%;height:auto;margin-bottom:12%}
.shot-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.shot.has-photo .shot-art svg{display:none}
.shot-tag{position:absolute;left:0;right:0;bottom:calc(var(--u)*5);text-align:center;font-family:var(--la);font-style:italic;font-weight:600;
  font-size:calc(var(--u)*5.4);letter-spacing:calc(var(--u)*.3);color:var(--burgundy);opacity:0;direction:ltr}
.shot:nth-child(1) .shot-tag{color:var(--gold-l)}
.shot.has-photo .shot-tag{color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.wipe{position:absolute;top:-10%;bottom:-10%;left:0;width:22%;z-index:6;opacity:0;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(255,236,190,.9),transparent)}
.show-text{position:absolute;left:0;right:0;top:75%;text-align:center;font-size:calc(var(--u)*7);font-weight:700;line-height:1.6;color:var(--cream);padding:0 calc(var(--u)*7);text-wrap:balance}

/* =====================================================================
   ۴) دعوت به حمایت
   ===================================================================== */
.cta-big{position:absolute;left:0;right:0;top:20%;text-align:center;font-size:calc(var(--u)*13);font-weight:900;line-height:1.35;color:var(--burgundy);
  padding:0 calc(var(--u)*6);opacity:0;text-wrap:balance}
.cta-ring{position:absolute;left:50%;top:32%;width:calc(var(--u)*120);height:calc(var(--u)*120);margin:calc(var(--u)*-60) 0 0 calc(var(--u)*-60);
  border-radius:50%;border:calc(var(--u)*.7) solid var(--burgundy);opacity:0;pointer-events:none}
.acts{position:absolute;left:0;right:0;top:57%;display:flex;justify-content:center;gap:calc(var(--u)*12)}
.act{display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*2.6);opacity:0}
.act-beat{position:relative;width:max(64px,calc(var(--u)*22));height:max(64px,calc(var(--u)*22))}
.act-btn{position:relative;z-index:1;width:100%;height:100%;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 30%,#FFFAF2,#FFF0D8 70%,#f1d7ae);
  box-shadow:0 0 0 calc(var(--u)*.5) var(--gold),0 calc(var(--u)*1.6) calc(var(--u)*4.5) rgba(128,13,34,.22);transition:background .3s}
.act-btn svg{width:50%;height:50%;fill:none;stroke:var(--burgundy);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;transition:fill .3s,stroke .3s}
.act-btn.liked,.act-btn.followed{background:radial-gradient(circle at 35% 30%,#b3253f,#800D22 65%,#5e0918)}
.act-btn.liked svg{fill:var(--cream);stroke:var(--cream)}
.act-btn.followed svg{stroke:var(--cream)}
.act-btn .ic-check{display:none}.act-btn.followed .ic-plus{display:none}.act-btn.followed .ic-check{display:inline}
.act-ring{position:absolute;inset:0;border-radius:50%;border:2px solid var(--burgundy);opacity:0;pointer-events:none}
.act-label{font-size:calc(var(--u)*4.6);font-weight:700;color:var(--burgundy)}

/* =====================================================================
   ۵) پایان: پیج اینستاگرام
   ===================================================================== */
#boxRays{top:39%}
.card-pos{position:absolute;left:50%;top:39%;transform:translate(-50%,-50%);z-index:3}
.card-zoom{transform:translate3d(0,0,0) scale(1);transition:transform .8s var(--ease)}
#stage.zoomed .card-pos{z-index:9}
#stage.zoomed .card-zoom{transform:translate3d(0,var(--zy,0px),0) scale(var(--zk,1.3))}
.card{position:relative;opacity:0;padding:calc(var(--u)*1.2);border-radius:calc(var(--u)*4.2);cursor:zoom-in;
  background:linear-gradient(145deg,#f8e6bb 0%,#C99A4A 35%,#f3dca6 58%,#a77a33 100%);
  box-shadow:0 calc(var(--u)*4) calc(var(--u)*10) rgba(0,0,0,.5),0 0 calc(var(--u)*12) rgba(232,201,135,.3)}
#stage.zoomed .card{cursor:zoom-out}
.card img{display:block;width:auto;height:auto;max-width:calc(var(--u)*78);max-height:calc(var(--sh)*.5);border-radius:calc(var(--u)*3);background:#fff}
.card-shine{position:absolute;inset:calc(var(--u)*1.2);border-radius:calc(var(--u)*3);overflow:hidden;pointer-events:none}
.card-shine::before{content:"";position:absolute;top:-20%;bottom:-20%;left:0;width:35%;transform:translateX(-160%) skewX(-18deg);
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent)}
.card.shine .card-shine::before{animation:cardSweep 1.1s ease-in-out forwards}
@keyframes cardSweep{to{transform:translateX(420%) skewX(-18deg)}}
.card-ring{position:absolute;inset:calc(var(--u)*-1.5);border-radius:calc(var(--u)*5.2);border:2px solid var(--gold-l);opacity:0;pointer-events:none}
.insta-fallback{display:none;width:auto;height:calc(var(--sh)*.5);max-width:calc(var(--u)*78);aspect-ratio:9/17;border-radius:calc(var(--u)*3);background:var(--milk);
  padding:calc(var(--u)*4) calc(var(--u)*3);flex-direction:column;gap:calc(var(--u)*2.4);direction:ltr;overflow:hidden}
.ig-head{display:flex;align-items:center;gap:calc(var(--u)*3)}
.ig-av{width:calc(var(--u)*13);height:calc(var(--u)*13);border-radius:50%;flex:none;display:grid;place-items:center;
  background:radial-gradient(circle,#FFF0D8 60%,transparent 61%),conic-gradient(var(--gold),var(--burgundy),var(--gold));font-family:var(--la);font-style:italic;color:var(--burgundy);font-size:calc(var(--u)*5)}
.ig-stats{display:flex;gap:calc(var(--u)*3);font-size:calc(var(--u)*2.6);color:var(--brown);text-align:center}
.ig-stats b{display:block;font-size:calc(var(--u)*3.2);color:var(--burgundy)}
.ig-name{font-family:var(--la);font-style:italic;font-size:calc(var(--u)*4);color:var(--burgundy)}
.ig-bar{height:calc(var(--u)*1.2);border-radius:9px;background:#f0dcc0}
.ig-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:calc(var(--u)*.7);margin-top:auto}
.ig-grid i{aspect-ratio:1;border-radius:calc(var(--u)*.8);background:linear-gradient(135deg,#FFF0D8,#f0d2a6)}
.ig-grid i:nth-child(odd){background:linear-gradient(135deg,#9e1a31,#5e0918)}
.ig-note{font-family:var(--fa);direction:rtl;font-size:calc(var(--u)*2.5);color:var(--gold);text-align:center}
.welcome{position:absolute;left:0;right:0;top:69%;z-index:5;display:flex;flex-direction:column;align-items:center;padding:0 calc(var(--u)*6);text-align:center}

  border:1px solid rgba(232,201,135,.55);background:rgba(74,6,19,.55)}
.replay.ready{pointer-events:auto}

/* دکمه صدا */
.snd{position:absolute;top:calc(var(--u)*3.5 + var(--safe-t));left:calc(var(--u)*3.5);z-index:12;width:max(44px,calc(var(--u)*9.5));height:max(44px,calc(var(--u)*9.5));border-radius:50%;

.snd svg{width:48%;height:48%}
.snd .on{display:none}.snd.playing .on{display:block}.snd.playing .off{display:none}

@media (prefers-reduced-motion:reduce){
  .logo-ring,.play::before,.rays::before,.gbox.lit .gb-seam{animation:none!important}
}

<script>
/* =====================================================================
   ⚙️ تنظیمات — فقط این بخش رو تغییر بدید
   ===================================================================== */
const LOGO_IMAGE      = "logo.png";            // فایل لوگو
const LOGO_ROUND      = true;                  // لوگوی گرد
const INSTAGRAM_IMAGE = "instagram-page.jpg";  // اسکرین‌شات پیج اینستاگرام
const MUSIC_FILE      = "music.mp3";                    // مثلاً "music.mp3" — خالی = موسیقی ریتمیک داخلی (هماهنگ با تصویر)
const PHOTOS          = ["cake1.jpg", "cake2.jpg", "cake3.jpg"];                    // عکس واقعی برای ۳ نمای معرفی، مثلاً ["cake1.jpg","cake2.jpg","cake3.jpg"]
const SPEED           = 1.25;                     // برای هماهنگی با موسیقی داخلی روی ۱ بمونه

const TXT = {
  start:  "برای شروع لمس کن",
  hook1:  "صبر کن!",
  hook2:  "یه اتفاق خوشمزه در راهه...",
  open:   "بالاخره شروع کردیم! 🎉",
  shots:  ["Signature Cakes", "Cupcakes", "Handmade Sweets"],
  show:   "یه شروع شیرین، با کلی عشق ❤️",
  cta:    "تو هم کنارمون باش!",
  like:   "لایک",
  follow: "فالو",
  brand:  "cackloris",
  end:    "به دنیای شیرین ما خوش اومدی ❤️",
  hint:   "",          // مثلاً "برای دیدن بهتر، روی تصویر بزن"
  replay: ""           // مثلاً "↻ دوباره" — خالی = دکمه نمایش داده نمی‌شه (کلید R همیشه کار می‌کنه)
};

/* =====================================================================
   تشخیص توان دستگاه
   ===================================================================== */
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const LITE = REDUCED || (navigator.deviceMemory || 8) <= 3 || (navigator.hardwareConcurrency || 8) <= 4;
if (LITE) document.documentElement.classList.add('lite');

/* =====================================================================
   ابزارهای پایه
   ===================================================================== */
const $ = s => document.querySelector(s);
const stage = $('#stage');
const EASE = 'cubic-bezier(.22,1,.36,1)';
const BOUNCE = 'cubic-bezier(.34,1.56,.64,1)';
let RUN = 0;
const CANCEL = {};
let UNIT = 4, SW = 400, SH = 711, T0 = 0, hiddenAt = 0;
const U = () => UNIT;
const go = p => { p.catch(() => {}); };

/* ساعت قابل توقف */
const Clock = (() => {
  let paused = false; const set = new Set();
  function run(t){ t.start = performance.now(); t.id = setTimeout(() => { set.delete(t); t.res(); }, t.rem); }
  function wait(ms){ return new Promise(res => { const t = {rem:Math.max(0, ms), res, start:0, id:0}; set.add(t); if (!paused) run(t); }); }
  function pause(){ if (paused) return; paused = true; const n = performance.now();
    set.forEach(t => { clearTimeout(t.id); t.rem = Math.max(0, t.rem - (n - t.start)); }); }
  function resume(){ if (!paused) return; paused = false; set.forEach(run); }
  function clear(){ set.forEach(t => clearTimeout(t.id)); set.clear(); }
  return {wait, pause, resume, clear};
})();

function sleep(ms){
  const id = RUN;
  return Clock.wait(ms * SPEED).then(() => { if (id !== RUN) throw CANCEL; });
}
/* زمان‌بندی مطلق نسبت به شروع کلیپ (هماهنگ با ضرب موسیقی) */
function at(sec){ return sleep((T0 + sec * 1000 * SPEED - performance.now()) / SPEED); }

function anim(el, kf, o = {}){
  if (!el) return Promise.resolve();
  const id = RUN;
  const opts = Object.assign({duration:1000, easing:EASE, fill:'forwards'}, o);
  opts.duration *= SPEED; if (opts.delay) opts.delay *= SPEED;
  const a = el.animate(kf, opts);
  const p = a.finished.then(() => {}, () => {}).then(() => { if (id !== RUN) throw CANCEL; });
  p.catch(() => {});
  return p;
}
function clearEl(el){
  el.getAnimations().forEach(a => a.cancel());
  el.style.removeProperty('opacity'); el.style.removeProperty('transform');
}
function pulse(el, k = 1.1, dur = 260, iterations = 1){
  return anim(el, [{transform:'scale(1)'}, {transform:`scale(${k})`}, {transform:'scale(1)'}], {duration:dur, iterations, easing:'ease-out', fill:'none', composite:'add'});
}
function out(els, dur = 200){
  els.forEach(el => anim(el, [{opacity:getComputedStyle(el).opacity}, {opacity:0, transform:'scale(.92)'}], {duration:dur, easing:'ease-in'}));
}
function punch(el, text, {from = 1.8, dur = 450} = {}){
  clearEl(el); el.textContent = text;
  return anim(el, [{opacity:0, transform:`scale(${from})`}, {opacity:1, transform:'scale(.97)', offset:.65}, {opacity:1, transform:'none'}],
    {duration:dur, easing:'cubic-bezier(.2,.9,.3,1)'});
}

/* ---------- اندازه صحنه 9:16 ---------- */
function layout(){
  const W = innerWidth, H = innerHeight;
  let sw, sh;
  if (W / H < 0.62) { sw = W; sh = H; } else { sh = H; sw = Math.round(H * 9 / 16); }
  SW = sw; SH = sh; UNIT = sw / 100;
  stage.style.setProperty('--sw', sw + 'px');
  stage.style.setProperty('--sh', sh + 'px');
  stage.style.setProperty('--u', UNIT + 'px');
  FX.resize(sw, sh);
}
function setBg(id){ document.querySelectorAll('.bg').forEach(b => b.classList.toggle('on', b.id === 'bg-' + id)); }
function setScene(id){
  stage.dataset.scene = id;
  document.querySelectorAll('.scene').forEach(s => s.classList.toggle('active', s.id === 'sc-' + id));
}

/* ---------- متن کلمه‌به‌کلمه (فقط opacity/transform) ---------- */
function splitWords(el, text){
  el.innerHTML = '';
  text.split(' ').forEach((t, i, arr) => {
    const s = document.createElement('span');
    s.className = 'w' + (/^[a-z]/i.test(t) ? ' latin' : '');
    s.textContent = t; el.appendChild(s);
    if (i < arr.length - 1) el.appendChild(document.createTextNode(' '));
  });
  return [...el.querySelectorAll('.w')];
}
async function revealWords(el, text, {stagger = 70, dur = 420, y = 2.5, scale = 1} = {}){
  clearEl(el);
  const ws = splitWords(el, text), u = U();
  el.style.opacity = '1';
  ws.forEach((w, i) => anim(w, [{opacity:0, transform:`translate3d(0,${y*u}px,0) scale(${scale})`}, {opacity:1, transform:'none'}], {duration:dur, delay:i * stagger}));
  await sleep((ws.length - 1) * stagger + dur);
}
function flash(color = 'rgba(255,240,210,1)', dur = 600){
  const f = $('#flash'); f.style.background = color;
  return anim(f, [{opacity:0}, {opacity:1, offset:.15}, {opacity:0}], {duration:dur, easing:'ease-out', fill:'none'});
}
function center(el){
  const r = el.getBoundingClientRect(), s = stage.getBoundingClientRect();
  return {x:r.left - s.left + r.width / 2, y:r.top - s.top + r.height / 2};
}

/* =====================================================================
   ذرات سبک: یک حلقه، اسپرایت پیش‌رندر، توقف خودکار
   ===================================================================== */
const FX = (() => {
  const cv = $('#fx'), ctx = cv.getContext('2d');
  let W = 0, H = 0, s = 1, parts = [], mode = 'none', acc = 0, raf = 0, last = 0, hidden = false;
  const MAX = REDUCED ? 40 : LITE ? 90 : 160;
  const RATE = LITE ? 4 : 8;
  const HEART = new Path2D('M0 6 C-14 -4 -8 -16 0 -8 C8 -16 14 -4 0 6Z');
  const CONF = ['#800D22','#C99A4A','#FFF0D8','#E8C987','#9E1A31'];
  const hex = h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
  function sprite(core, edge){
    const c = document.createElement('canvas'); c.width = c.height = 32;
    const g = c.getContext('2d'), a = hex(core), b = hex(edge);
    const gr = g.createRadialGradient(16,16,0,16,16,16);
    gr.addColorStop(0, `rgba(${a},1)`); gr.addColorStop(.3, `rgba(${b},.6)`); gr.addColorStop(1, `rgba(${b},0)`);
    g.fillStyle = gr; g.fillRect(0,0,32,32); return c;
  }
  const SP = ['#fff3d4','#E8C987','#f7e6bd'].map(c => sprite(c, '#C99A4A'));
  const pick = a => a[Math.random() * a.length | 0];
  const rnd = (a, b) => a + Math.random() * (b - a);
  const scaleN = n => Math.round(n * (LITE ? .5 : 1) * (REDUCED ? .3 : 1));

  function resize(w, h){
    const dpr = Math.min(devicePixelRatio || 1, LITE ? 1 : 1.5);
    W = w; H = h; s = w / 400;
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function add(p){ if (parts.length < MAX) parts.push(p); }
  function spawn(){
    add({k:'dust', img:pick(SP), x:rnd(0,W), y:H + 8, vx:rnd(-6,6)*s, vy:-rnd(14,34)*s, r:rnd(1.4,3.6)*s, life:0, max:rnd(6,10), ph:rnd(0,6)});
  }
  function burst(x, y, n = 30, kind = 'spark', spread = 1){
    n = scaleN(n);
    for (let i = 0; i < n; i++) {
      const a = rnd(0, Math.PI * 2), sp = rnd(80, 300) * spread * s;
      const p = {k:kind, x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:0, max:rnd(1.2,2.2), rot:rnd(-.5,.5), ph:rnd(0,6)};
      if (kind === 'heart') { p.r = rnd(5,10)*s; p.vy -= 60*s; p.c = Math.random() < .6 ? '#9E1A31' : '#C99A4A'; }
      else if (kind === 'confetti') { p.r = rnd(3,6)*s; p.vy -= 140*s; p.c = pick(CONF); p.vr = rnd(-8,8); p.max = rnd(1.8,2.8); }
      else { p.r = rnd(1.2,2.8)*s; p.img = pick(SP); }
      add(p);
    }
    kick();
  }
  function floatHearts(n = 10){
    n = scaleN(n);
    for (let i = 0; i < n; i++) Clock.wait(i * 160).then(() => {
      add({k:'heart', float:1, x:rnd(W*.1, W*.9), y:H + 20, vx:rnd(-12,12)*s, vy:-rnd(80,130)*s,
        r:rnd(5,11)*s, life:0, max:rnd(4,6), c:Math.random() < .65 ? '#9E1A31' : '#C99A4A', rot:rnd(-.4,.4), ph:rnd(0,6)});
      kick();
    });
  }
  function tick(now){
    const dt = Math.min((now - last) / 1000, .05); last = now;
    ctx.clearRect(0, 0, W, H);
    if (mode === 'gold' && !REDUCED) { acc += RATE * dt; while (acc >= 1) { acc--; spawn(); } }
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i]; p.life += dt;
      const k = p.life / p.max;
      if (k >= 1 || p.y < -60 || p.y > H + 60) { parts[i] = parts[parts.length - 1]; parts.pop(); continue; }
      p.ph += dt * 2;
      let al;
      if (p.k === 'dust') { p.x += (p.vx + Math.sin(p.ph) * 8 * s) * dt; p.y += p.vy * dt; al = Math.sin(k * Math.PI) * .8; }
      else if (p.float) { p.x += (p.vx + Math.sin(p.ph) * 18 * s) * dt; p.y += p.vy * dt; al = Math.min(1, k * 8) * (1 - k); }
      else if (p.k === 'confetti') { const d = 1 - 1.8 * dt; p.vx *= d; p.vy = p.vy * d + 170 * s * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt; al = k < .75 ? 1 : (1 - k) * 4; }
      else { const d = 1 - 2.4 * dt; p.vx *= d; p.vy = p.vy * d + 90 * s * dt; p.x += p.vx * dt; p.y += p.vy * dt; al = 1 - k; }
      ctx.globalAlpha = al > 0 ? al : 0;
      if (p.k === 'heart') {
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot + Math.sin(p.ph) * .2);
        const sc = p.r / 8; ctx.scale(sc, sc); ctx.fillStyle = p.c; ctx.fill(HEART); ctx.restore();
      } else if (p.k === 'confetti') {
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.scale(1, Math.cos(p.ph * 3));
        ctx.fillStyle = p.c; ctx.fillRect(-p.r * .5, -p.r, p.r, p.r * 2); ctx.restore();
      } else {
        const d = p.r * 4; ctx.drawImage(p.img, p.x - d / 2, p.y - d / 2, d, d);
      }
    }
    ctx.globalAlpha = 1;
    if (!hidden && (parts.length || (mode === 'gold' && !REDUCED))) raf = requestAnimationFrame(tick);
    else { raf = 0; if (!parts.length) ctx.clearRect(0, 0, W, H); }
  }
  function kick(){ if (!raf && !hidden) { last = performance.now(); raf = requestAnimationFrame(tick); } }
  return {
    resize, burst, floatHearts,
    setAmbient(m){ mode = m; acc = 0; kick(); },
    clear(){ parts.length = 0; acc = 0; ctx.clearRect(0, 0, W, H); },
    pause(){ hidden = true; cancelAnimationFrame(raf); raf = 0; },
    resume(){ hidden = false; kick(); }
  };
})();

/* =====================================================================
   موسیقی ریتمیک ۱۲۰ BPM (هماهنگ با تایم‌لاین تصویر)
   ===================================================================== */
const Music = (() => {
  let ctx, master, bus, timer, audioEl, noiseBuf, t0 = 0, step = 0, muted = false, running = false;
  const S = (60 / 120 / 4)*SPEED;                                   // یک شانزدهم
  const CH = [[60,64,67],[55,59,62],[57,60,64],[53,57,60]]; // C G Am F
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);

  function init(){
    const AC = window.AudioContext || window.webkitAudioContext;
    ctx = new AC();
    master = ctx.createGain(); master.gain.value = muted ? 0 : .85;
    const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4;
    master.connect(comp); comp.connect(ctx.destination);
    const len = ctx.sampleRate; noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  function env(g, t, v, a, d){ g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(Math.max(v, .0002), t + a); g.gain.exponentialRampToValueAtTime(.0001, t + a + d); }
  function tone(m, t, {v = .1, d = .3, type = 'triangle'} = {}){
    const o = ctx.createOscillator(), g = ctx.createGain(); o.type = type; o.frequency.value = hz(m);
    env(g, t, v, .005, d); o.connect(g); g.connect(bus); o.start(t); o.stop(t + d + .05);
  }
  function kick(t, v = 1){
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(160, t); o.frequency.exponentialRampToValueAtTime(45, t + .12);
    env(g, t, v, .002, .3); o.connect(g); g.connect(bus); o.start(t); o.stop(t + .36);
  }
  function noise(t, {v = .2, a = .002, d = .05, type = 'highpass', f = 7000, f2 = 0, q = 1} = {}){
    const s = ctx.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
    const fl = ctx.createBiquadFilter(); fl.type = type; fl.Q.value = q; fl.frequency.setValueAtTime(f, t);
    if (f2) fl.frequency.exponentialRampToValueAtTime(f2, t + a + d);
    const g = ctx.createGain(); env(g, t, v, a, d);
    s.connect(fl); fl.connect(g); g.connect(bus); s.start(t, Math.random() * .5); s.stop(t + a + d + .05);
  }
  const hat = (t, v) => noise(t, {v, d:.035, f:7500});
  function snare(t, v){ noise(t, {v, d:.13, type:'bandpass', f:1900, q:.8}); tone(50, t, {v:v * .5, d:.08}); }
  function chord(ch, t){ ch.forEach(m => { tone(m, t, {v:.04, d:.4}); tone(m + 12, t, {v:.022, d:.3, type:'sine'}); }); }
  function impact(t, k = 1){
    kick(t, 1.2 * k);
    const o = ctx.createOscillator(), g = ctx.createGain(); o.type = 'sine';
    o.frequency.setValueAtTime(110, t); o.frequency.exponentialRampToValueAtTime(28, t + .9);
    env(g, t, .7 * k, .005, .9); o.connect(g); g.connect(bus); o.start(t); o.stop(t + 1);
    noise(t, {v:.45 * k, d:.7, type:'lowpass', f:4000, f2:150});
  }
  const whoosh = t => noise(t, {v:.16, a:.25, d:.12, type:'bandpass', f:500, f2:5000, q:1.2});
  const riser = (t, dur) => noise(t, {v:.22, a:dur, d:.05, type:'bandpass', f:300, f2:6000, q:2});
  function finale(t){
    kick(t, 1.2); tone(36, t, {v:.22, d:1.6});
    [60,64,67,72].forEach(m => tone(m, t, {v:.055, d:2.2}));
    noise(t, {v:.08, d:1.2, f:6000});
  }
  function sched(){
    if (!bus) return;
    while (running && t0 + step * S < ctx.currentTime + .3) {
      const t = t0 + step * S, sec = step * (60 / 120 / 4), i = step % 16, ch = CH[Math.floor(sec / 2) % 4];
      if (sec >= 14.5) { running = false; clearInterval(timer); break; }
      if (sec < 2.25) { if (i % 4 === 0) kick(t, .85); if (i % 4 === 2) hat(t, .1); }
      else if (sec < 3.5) { if (sec >= 2.5 && (sec >= 3 || i % 2 === 0)) snare(t, .06 + (sec - 2.5) * .25); }
      else {
        if (i % 4 === 0) kick(t);
        if (i % 4 === 2) hat(t, .13); else if (i % 2 === 1) hat(t, .04);
        if (i === 4 || i === 12) snare(t, .3);
        if (i % 2 === 0) tone(ch[0] - 12, t, {v:.15, d:.2});
        if (i === 0 || i === 6 || i === 12) chord(ch, t);
        if (i % 4 === 3) tone(ch[(step >> 2) % 3] + 24, t, {v:.03, d:.18, type:'sine'});
      }
      step++;
    }
  }
  function start(){
    reset();
    if (MUSIC_FILE) {
      if (!audioEl) { audioEl = new Audio(MUSIC_FILE); audioEl.preload = 'auto'; }
      audioEl.volume = .8; audioEl.muted = muted; audioEl.currentTime = 0;
      audioEl.play().catch(() => {}); running = true; return;
    }
    try {
      if (!ctx) init();
      ctx.resume();
      bus = ctx.createGain(); bus.connect(master);
      t0 = ctx.currentTime + .06; step = 0; running = true;
      impact(t0);
      riser(t0 + 2.25 * SPEED, 1.25 * SPEED);
      impact(t0 + 3.5 * SPEED);
      
      [6.5, 7.25, 8].forEach(x => whoosh(t0 + (x - .25) * SPEED));
      
      impact(t0 + 9 * SPEED, .8);
      impact(t0 + 11.5 * SPEED);
      finale(t0 + 14.5 * SPEED);
      timer = setInterval(sched, 100); sched();
    } catch (e) {}
  }
  function reset(){
    clearInterval(timer); running = false;
    if (audioEl) audioEl.pause();
    if (bus) { const b = bus; b.gain.setTargetAtTime(0, ctx.currentTime, .03); setTimeout(() => b.disconnect(), 300); bus = null; }
  }
  function fileEnd(){
    if (!audioEl || audioEl.paused) return;
    let v = audioEl.volume; const id = setInterval(() => { v -= .08; if (v <= 0) { clearInterval(id); audioEl.pause(); } else audioEl.volume = v; }, 60);
  }
  function setMuted(m){
    muted = m;
    if (master) master.gain.setTargetAtTime(m ? 0 : .85, ctx.currentTime, .05);
    if (audioEl) audioEl.muted = m;
    $('#sndBtn').classList.toggle('playing', !m);
  }
  function suspend(){ if (ctx && ctx.state === 'running') ctx.suspend(); if (audioEl && running) audioEl.pause(); }
  function resume(){ if (ctx) ctx.resume(); if (audioEl && running) audioEl.play().catch(() => {}); }
  return {start, reset, fileEnd, setMuted, suspend, resume, get muted(){ return muted; }};
})();

  b.classList.add('followed');
  anim(b, [{transform:'scale(1)'}, {transform:'scale(1.25)'}, {transform:'scale(1)'}], {duration:450, easing:BOUNCE, fill:'none'});
  anim($('#followRing'), [{opacity:.9, transform:'scale(1)'}, {opacity:0, transform:'scale(2.1)'}], {duration:700, fill:'none'});
  const c = center(b); FX.burst(c.x, c.y, 22, 'spark', 1);
}

/* =====================================================================
   ۵) پایان: پیج اینستاگرام — 11.5 تا 15
   ===================================================================== */
let cardReady = false;
async function sceneReveal(){
  await at(11.5);
  setScene('reveal'); setBg('reveal'); FX.setAmbient(LITE ? 'none' : 'gold');
  const u = U();
  flash('rgba(255,236,196,.9)', 500);
  anim($('#boxRays'), [{opacity:0, transform:'scale(.4)'}, {opacity:1, transform:'scale(1)'}], {duration:900});
  anim($('#card'), [
    {opacity:0, transform:`translate3d(0,${u*20}px,0) scale(.6)`},
    {opacity:1, transform:'scale(1.03)', offset:.7},
    {opacity:1, transform:'none'}], {duration:700});
  await at(11.8);
  const cc = center($('#card')); FX.burst(cc.x, cc.y, 40, 'spark', 1.2);
  await at(12.0);
  $('#card').classList.add('shine');
  go(revealWords($('#brandName'), TXT.brand, {stagger:0, dur:500, y:2, scale:.8}));
  await at(12.5);
  go(revealWords($('#w1'), TXT.end, {stagger:60, dur:400}));
  await at(12.6);
  anim($('#card'), [{transform:'none'}, {transform:'scale(1.07)'}], {duration:2400, easing:'ease-in-out'});
  cardReady = true;
  await at(13.0);
  anim($('#cardRing'), 9,[{ transform:'scale(1)'}, {opacity:0, transform:'scale(1.1)'}], {duration:900, iterations:2, fill:'none'});
  await at(13.5); FX.floatHearts(8);
  await at(14.5);
  const c2 = center($('#card')); FX.burst(c2.x, c2.y, 30, 'spark', 1.1);
  if (MUSIC_FILE) Music.fileEnd();
  if (TXT.hint) { $('#hint').textContent = TXT.hint; anim($('#hint'), [{opacity:0}, {opacity:1}], {duration:400}); }
  await at(15.2);
  FX.setAmbient('none');
  if (TXT.replay) {
    $('#replayBtn').textContent = TXT.replay;
    await anim($('#replayBtn'), [{opacity:0}, {opacity:1}], {duration:400});
    $('#replayBtn').classList.add('ready');
  }
}

/* ---------- زوم نرم عکس پیج (تمام صفحه را نمی‌گیرد) ---------- */
function setZoom(on){
  if (on && !cardReady) return;
  if (on) {
    const r = $('#card').getBoundingClientRect(), s = stage.getBoundingClientRect();
    const k = Math.max(1, Math.min(1.4, (SW * .9) / r.width * 1.07, (SH * .8) / r.height * 1.07));
    const cy = r.top - s.top + r.height / 2;
    stage.style.setProperty('--zk', k.toFixed(3));
    stage.style.setProperty('--zy', (SH * .5 - cy).toFixed(1) + 'px');
  }
  stage.classList.toggle('zoomed', on);
}
$('#card').addEventListener('click', () => setZoom(!stage.classList.contains('zoomed')));
$('#zoomDim').addEventListener('click', () => setZoom(false));

/* =====================================================================
   کنترل تایم‌لاین
   ===================================================================== */
async function playStory(){
  try {
    await sceneHook();
    await sceneOpen();
    await sceneShow();
    await sceneCta();
    await sceneReveal();
  } catch (e) { if (e !== CANCEL) console.warn(e); }
}

function resetAll(){
  RUN++;
  Clock.clear();
  Music.reset();
  stage.getAnimations({subtree:true}).forEach(a => {
    const css = (typeof CSSAnimation !== 'undefined' && a instanceof CSSAnimation) || (typeof CSSTransition !== 'undefined' && a instanceof CSSTransition);
    if (!css) a.cancel();
  });
  ['#hook1','#hook2','#openText','#showText','#ctaBig','#brandName','#w1','#hint'].forEach(s => { const e = $(s); e.innerHTML = ''; clearEl(e); });
  stage.querySelectorAll('.scene *, #flash').forEach(el => { el.style.removeProperty('opacity'); el.style.removeProperty('transform'); });
  $('#iBox').classList.remove('lit');
  $('#heartBtn').classList.remove('liked');
  $('#followBtn').classList.remove('followed');
  $('#card').classList.remove('shine');
  $('#replayBtn').classList.remove('ready');
  stage.classList.remove('zoomed');
  cardReady = false;
  FX.clear(); FX.setAmbient('none');
}

function startClip(){
  resetAll();
  $('#gate').classList.add('off');
  Music.start();
  T0 = performance.now();
  playStory();
}

let started = false;
$('#startBtn').addEventListener('click', () => { if (started) return; started = true; startClip(); });
$('#replayBtn').addEventListener('click', () => { if ($('#replayBtn').classList.contains('ready')) startClip(); });
$('#heartBtn').addEventListener('click', likeHeart);
$('#followBtn').addEventListener('click', followIt);
$('#sndBtn').addEventListener('click', e => { e.stopPropagation(); Music.setMuted(!Music.muted); });

/* کلیدها: H = ضبط تمیز، R = اجرای مجدد، M = صدا، Esc = بستن زوم */
addEventListener('keydown', e => {
  const k = (e.key || '').toLowerCase();
  if (k === 'h') document.body.classList.toggle('clean');
  if (k === 'r') { started = true; startClip(); }
  if (k === 'm') $('#sndBtn').click();
  if (k === 'escape') setZoom(false);
});

/* ---------- پارالاکس سبک (فقط دسکتاپ) ---------- */
if (matchMedia('(hover:hover) and (pointer:fine)').matches && !REDUCED) {
  const els = [...document.querySelectorAll('.px')];
  let tx = 0, ty = 0, pending = false;
  addEventListener('pointermove', e => {
    tx = (e.clientX / innerWidth - .5) * 2; ty = (e.clientY / innerHeight - .5) * 2;
    if (pending) return; pending = true;
    requestAnimationFrame(() => {
      pending = false;
      els.forEach(el => { const d = +el.dataset.depth || 10; el.style.transform = `translate3d(${-tx * d}px,${-ty * d}px,0)`; });
    });
  }, {passive:true});
}

/* ---------- بارگذاری تصاویر با جایگزین ---------- */
(() => {
  const li = $('#logoImg');
  if (LOGO_ROUND) $('#logoWrap').classList.add('round');
  li.onerror = () => { li.style.display = 'none'; $('#logoFallback').style.display = 'flex'; };
  li.src = LOGO_IMAGE;
  const ii = $('#instaImg');
  ii.onerror = () => { ii.style.display = 'none'; $('#instaFallback').style.display = 'flex'; };
  ii.src = INSTAGRAM_IMAGE;
  document.querySelectorAll('.shot').forEach((s, i) => {
    s.querySelector('.shot-tag').textContent = TXT.shots[i] || '';
    if (!PHOTOS[i]) return;
    const im = new Image(); im.className = 'shot-photo'; im.decoding = 'async'; im.alt = '';
    im.onload = () => { s.querySelector('.shot-art').prepend(im); s.classList.add('has-photo'); };
    im.src = PHOTOS[i];
  });
})();

/* ---------- توقف کامل وقتی تب مخفی است ---------- */
let pausedAnims = [];
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    hiddenAt = performance.now();
    Clock.pause(); FX.pause(); Music.suspend();
    pausedAnims = document.getAnimations().filter(a => a.playState === 'running');
    pausedAnims.forEach(a => a.pause());
  } else {
    if (hiddenAt) T0 += performance.now() - hiddenAt;   // زمان‌بندی مطلق هم جابه‌جا می‌شه
    hiddenAt = 0;
    pausedAnims.forEach(a => { try { a.play(); } catch (e) {} }); pausedAnims = [];
    Clock.resume(); FX.resume(); Music.resume();
  }
});

/* ---------- شروع ---------- */
let rzT = 0;
addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(() => { layout(); if (stage.classList.contains('zoomed')) setZoom(true); }, 150); });
$('#ctaLabel').textContent = TXT.start;
$('#likeLabel').textContent = TXT.like;
$('#followLabel').textContent = TXT.follow;
setScene('hook'); setBg('intro');
layout();
</script>
</body>
