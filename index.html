<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4A0613">
<title>cackloris · افتتاح</title>

<!-- فونت آنلاین (اختیاری). اگه اینترنت نباشه فونت‌های جایگزین استفاده می‌شن -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700&family=Playfair+Display:ital,wght@1,500;1,600&display=swap">

<style>
/* =====================================================================
   برای اجرای کاملاً آفلاین با فونت وزیرمتن:
   فایل‌های فونت رو کنار index.html بذارید و این بخش رو از کامنت خارج کنید.
@font-face{font-family:'Vazirmatn';src:url('Vazirmatn-Light.woff2') format('woff2');font-weight:300;font-display:swap}
@font-face{font-family:'Vazirmatn';src:url('Vazirmatn-Regular.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Vazirmatn';src:url('Vazirmatn-Bold.woff2') format('woff2');font-weight:700;font-display:swap}
   ===================================================================== */

/* ---------- پالت و متغیرها ---------- */
:root{
  --burgundy:#800D22; --burgundy-2:#9E1A31; --burgundy-deep:#4A0613;
  --cream:#FFF0D8; --gold:#C99A4A; --gold-l:#E8C987; --milk:#FFFAF2; --brown:#6B4A3A;
  --fa:'Vazirmatn','Vazir','IRANSansX','IRANSans','Estedad','Shabnam','Sahel','Segoe UI',Tahoma,sans-serif;
  --la:'Playfair Display','Didot','Bodoni 72','Bodoni MT',Georgia,'Times New Roman',serif;
  --u:3.9px;            /* یک درصد عرض صحنه (با JS تنظیم می‌شه) */
  --sw:100vw; --sh:100vh;
  --ease:cubic-bezier(.22,1,.36,1);
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#1d0409;overscroll-behavior:none}
body{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--fa);color:var(--burgundy);
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
::-webkit-scrollbar{display:none}
button{font:inherit;border:none;background:none;cursor:pointer;color:inherit;touch-action:manipulation}
.ltr{direction:ltr;unicode-bidi:isolate}

.backdrop{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 40%,#5a0a1a 0%,#2a050c 55%,#120204 100%)}

/* ---------- صحنه اصلی 9:16 ---------- */
#stage{position:relative;width:var(--sw);height:var(--sh);overflow:hidden;isolation:isolate;contain:layout paint size;
  box-shadow:0 0 calc(var(--u)*20) rgba(0,0,0,.6)}

/* ---------- پس‌زمینه‌ها (Crossfade فقط با opacity) ---------- */
#bgs{position:absolute;inset:0;z-index:0}
.bg{position:absolute;inset:0;opacity:0;transition:opacity 1.6s ease}
.bg.on{opacity:1}
#bg-intro{background:radial-gradient(120% 80% at 50% 45%,#a01a33 0%,#800D22 30%,#4A0613 72%,#25030a 100%)}
#bg-story{background:
  radial-gradient(70% 40% at 0% 100%,rgba(128,13,34,.22),transparent 70%),
  radial-gradient(70% 40% at 100% 0%,rgba(128,13,34,.18),transparent 70%),
  radial-gradient(110% 70% at 50% 45%,#FFFAF2 0%,#FFF0D8 45%,#f3d9b4 80%,#e2b493 100%)}
#bg-dim{background:radial-gradient(110% 70% at 50% 45%,#f3ebe2 0%,#e3d4c5 50%,#bfa898 100%)}
#bg-night{background:radial-gradient(100% 70% at 50% 50%,#5c0a1b 0%,#3a0510 55%,#1a0206 100%)}
#bg-dawn{background:
  radial-gradient(80% 45% at 50% 66%,rgba(255,214,140,.7),transparent 70%),
  radial-gradient(110% 70% at 50% 50%,#FFFAF2 0%,#FFF0D8 45%,#f1cfa0 80%,#c9798a 120%)}
#bg-light{background:radial-gradient(110% 70% at 50% 35%,#ffffff 0%,#FFFAF2 40%,#FFF0D8 75%,#f0d8ba 100%)}
#bg-reveal{background:radial-gradient(75% 48% at 50% 40%,#a8203a 0%,#800D22 35%,#4A0613 72%,#1d0207 100%)}

/* نور گرم امید (از شمع پخش می‌شه) */
#warm{position:absolute;z-index:1;left:50%;top:64%;width:calc(var(--u)*190);height:calc(var(--u)*190);
  margin:calc(var(--u)*-95) 0 0 calc(var(--u)*-95);border-radius:50%;pointer-events:none;opacity:0;
  background:radial-gradient(circle,rgba(255,214,140,.6) 0%,rgba(255,200,120,.22) 35%,transparent 65%)}

/* ---------- صحنه‌ها ---------- */
.scene{position:absolute;inset:0;z-index:3;opacity:0;visibility:hidden;transition:opacity 1s ease,visibility 0s linear 1s}
.scene.active{opacity:1;visibility:visible;transition:opacity 1s ease,visibility 0s}
/* انیمیشن‌های CSS صحنه‌های غیرفعال متوقف می‌شن (صرفه‌جویی CPU) */
.scene:not(.active),.scene:not(.active) *{animation-play-state:paused!important}
.px{transition:transform .8s ease-out}
.w{display:inline-block;opacity:0}
.w.latin{font-family:var(--la);font-style:italic;direction:ltr}
.gold .w,.gold-t{background:linear-gradient(100deg,#b8873a 0%,#f6dfa8 40%,#C99A4A 60%,#f7e6bd 85%);
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}

#fx{position:absolute;inset:0;width:100%;height:100%;z-index:5;pointer-events:none}
#flash{position:absolute;inset:0;z-index:6;pointer-events:none;opacity:0}
.vignette{position:absolute;inset:0;z-index:7;pointer-events:none;opacity:.65;transition:opacity 1.6s ease;
  background:radial-gradient(120% 90% at 50% 50%,transparent 50%,rgba(30,0,8,.5) 100%)}
#stage.dark .vignette{opacity:1}
@keyframes spin{to{transform:rotate(360deg)}}

/* =====================================================================
   جعبه شیرینی لوکس (مشترک بین صحنه شروع و رونمایی)
   ===================================================================== */
.gbox{position:relative;width:calc(var(--u)*56);height:calc(var(--u)*54)}
.gb-halo{position:absolute;left:50%;top:58%;width:calc(var(--u)*120);height:calc(var(--u)*120);margin:calc(var(--u)*-60) 0 0 calc(var(--u)*-60);
  border-radius:50%;pointer-events:none;opacity:0;transition:opacity 1.2s ease;
  background:radial-gradient(circle,rgba(255,226,170,.42) 0%,rgba(201,154,74,.14) 38%,transparent 64%)}
.gbox.lit .gb-halo{opacity:1;animation:breathe 4.5s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(.92)}}
.gb-shadow{position:absolute;left:50%;bottom:calc(var(--u)*-3.5);width:calc(var(--u)*72);height:calc(var(--u)*7);margin-left:calc(var(--u)*-36);
  background:radial-gradient(ellipse,rgba(0,0,0,.45),transparent 70%)}
.gb-body{position:absolute;left:0;bottom:0;width:100%;height:calc(var(--u)*40);border-radius:calc(var(--u)*1.4);overflow:hidden;
  background:linear-gradient(180deg,#fffaf2 0%,#FFF0D8 55%,#ecd2a8 100%);
  box-shadow:inset 0 0 0 calc(var(--u)*.45) rgba(201,154,74,.7),inset 0 calc(var(--u)*-4) calc(var(--u)*6) rgba(128,13,34,.1),0 calc(var(--u)*3) calc(var(--u)*7) rgba(0,0,0,.35)}
.gb-body::before{content:"";position:absolute;inset:calc(var(--u)*1.6);border:1px solid rgba(201,154,74,.5);border-radius:calc(var(--u)*.8)}
.rib-v{position:absolute;left:50%;top:0;bottom:0;width:calc(var(--u)*6.6);margin-left:calc(var(--u)*-3.3);
  background:linear-gradient(90deg,#5e0918,#a3182f 50%,#5e0918);box-shadow:0 0 0 1px rgba(201,154,74,.45)}
.rib-h{position:absolute;top:50%;left:0;right:0;height:calc(var(--u)*5.6);margin-top:calc(var(--u)*-2.8);
  background:linear-gradient(180deg,#5e0918,#a3182f 50%,#5e0918);box-shadow:0 0 0 1px rgba(201,154,74,.45)}
.gb-tag{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);white-space:nowrap;
  padding:calc(var(--u)*.9) calc(var(--u)*3.4);border-radius:99px;
  background:linear-gradient(180deg,#fffaf2,#f6e4c4);
  box-shadow:0 0 0 calc(var(--u)*.35) var(--gold),0 calc(var(--u)*.6) calc(var(--u)*1.6) rgba(74,6,19,.35);
  font-family:var(--la);font-style:italic;font-weight:600;font-size:calc(var(--u)*3.6);color:var(--burgundy)}
.gb-lid{position:absolute;left:calc(var(--u)*-3);bottom:calc(var(--u)*39);width:calc(var(--u)*62);height:calc(var(--u)*11);
  border-radius:calc(var(--u)*1.4);transform-origin:12% 100%;
  background:linear-gradient(180deg,#fffaf2,#f5e1c2);
  box-shadow:inset 0 0 0 calc(var(--u)*.45) rgba(201,154,74,.75),0 calc(var(--u)*1) calc(var(--u)*2.5) rgba(0,0,0,.25)}
.gb-lid .rib-v{border-radius:0}
.lid-edge{position:absolute;left:0;right:0;bottom:0;height:calc(var(--u)*1.1);border-radius:0 0 calc(var(--u)*1.4) calc(var(--u)*1.4);
  background:linear-gradient(90deg,#a77a33,#ecd08f 50%,#a77a33)}
.bow{position:absolute;left:50%;top:calc(var(--u)*-11.5);width:calc(var(--u)*34);margin-left:calc(var(--u)*-17)}
.bow svg{display:block;width:100%;height:auto}
.gb-seam{position:absolute;left:calc(var(--u)*1);right:calc(var(--u)*1);bottom:calc(var(--u)*39.4);height:calc(var(--u)*.8);border-radius:9px;opacity:0;
  background:#fff3d4;box-shadow:0 0 calc(var(--u)*3) calc(var(--u)*1) rgba(255,214,140,.9)}
.gbox.lit .gb-seam{animation:seam 2.6s ease-in-out infinite}
@keyframes seam{0%,100%{opacity:.4}50%{opacity:1}}
.gb-glow{position:absolute;left:50%;bottom:calc(var(--u)*33);width:calc(var(--u)*96);height:calc(var(--u)*40);margin-left:calc(var(--u)*-48);opacity:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 75%,rgba(255,242,205,.95),rgba(232,201,135,.4) 35%,transparent 70%)}
.gb-beam{position:absolute;left:50%;bottom:calc(var(--u)*40);width:calc(var(--u)*120);height:calc(var(--u)*110);margin-left:calc(var(--u)*-60);
  opacity:0;pointer-events:none;transform-origin:50% 100%;
  background:linear-gradient(to top,rgba(255,240,205,.85),rgba(255,220,150,.22) 50%,transparent);
  clip-path:polygon(40% 100%,60% 100%,100% 0,0 0)}
.gbox.idle{animation:floaty 4.5s ease-in-out infinite}
@keyframes floaty{50%{transform:translateY(calc(var(--u)*-1.4))}}

/* =====================================================================
   صحنه ۱: شروع (جعبه + کنجکاوی)
   ===================================================================== */
.brand-top{position:absolute;z-index:2;top:calc(4.5% + var(--safe-t));left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*5.5);opacity:0}
.seal{position:relative;width:calc(var(--u)*20);height:calc(var(--u)*20);display:grid;place-items:center}
.logo-ring{position:absolute;inset:-14%;width:128%;height:128%;animation:spin 60s linear infinite;direction:ltr}
.logo-img{position:relative;width:100%;height:100%;object-fit:contain; transform: scale(1.45);transform-origin: center;}
.seal.round .logo-img{border-radius:50%;object-fit:cover;
  box-shadow:0 0 0 calc(var(--u)*.45) var(--gold),0 calc(var(--u)*1.2) calc(var(--u)*3.5) rgba(0,0,0,.35)}
.logo-fallback{position:relative;width:80%;height:80%;border-radius:50%;display:none;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(circle at 40% 35%,#FFFAF2,#FFF0D8 70%,#f2d9b2);box-shadow:0 0 0 calc(var(--u)*.45) var(--gold)}
.logo-fallback b{font-family:var(--la);font-style:italic;font-weight:600;font-size:calc(var(--u)*3.3);color:var(--burgundy);direction:ltr}
.logo-fallback small{font-size:calc(var(--u)*1.7);color:var(--gold)}
.top-cap{display:flex;align-items:center;gap:calc(var(--u)*2.4);font-family:var(--la);font-style:italic;font-size:calc(var(--u)*2.7);
  letter-spacing:calc(var(--u)*.8);color:var(--gold-l)}
.top-cap i{display:block;width:calc(var(--u)*9);height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
.top-cap i:last-child{transform:scaleX(-1)}

.intro-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-top:calc(var(--u)*22)}
.ibox-wrap{opacity:0}
.intro-text{margin-top:calc(var(--u)*10);min-height:1.7em;font-size:calc(var(--u)*6.2);line-height:1.7;font-weight:400;color:var(--cream);
  text-align:center;padding:0 calc(var(--u)*8);text-shadow:0 0 calc(var(--u)*3) rgba(232,201,135,.4)}
.cta-wrap{position:relative;margin-top:calc(var(--u)*6);opacity:0;pointer-events:none}
.cta-wrap.ready{pointer-events:auto}
.cta-wrap::before{content:"";position:absolute;inset:calc(var(--u)*-1.2);border-radius:999px;
  border:1px solid rgba(232,201,135,.6);animation:ringOut 2.6s ease-out infinite;pointer-events:none}
@keyframes ringOut{0%{transform:scale(.95);opacity:.9}100%{transform:scale(1.25,1.5);opacity:0}}
.cta{position:relative;overflow:hidden;display:block;min-height:48px;min-width:calc(var(--u)*50);
  font-size:calc(var(--u)*5);font-weight:700;color:var(--burgundy-deep);
  padding:calc(var(--u)*3) calc(var(--u)*10);border-radius:999px;
  background:linear-gradient(135deg,#f8e7bd 0%,#E8C987 35%,#C99A4A 70%,#f0d49a 100%);
  box-shadow:0 0 0 calc(var(--u)*.4) rgba(255,240,216,.45),0 calc(var(--u)*1.6) calc(var(--u)*5) rgba(0,0,0,.35),0 0 calc(var(--u)*6) rgba(232,201,135,.4);
  transition:transform .4s cubic-bezier(.34,1.56,.64,1)}
.cta::before{content:"";position:absolute;top:0;bottom:0;left:0;width:40%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.7),transparent);
  transform:translateX(-160%) skewX(-20deg);animation:sweep 3.2s ease-in-out infinite}
.cta:active{transform:scale(.95);transition-duration:.12s}
@media (hover:hover){.cta:hover{transform:translateY(-2px) scale(1.04)}}
.cta-label{position:relative;z-index:1}
@keyframes sweep{0%,55%{transform:translateX(-160%) skewX(-20deg)}100%{transform:translateX(330%) skewX(-20deg)}}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.65);pointer-events:none;transform:scale(0)}

/* =====================================================================
   صحنه ۲: داستان تصویری
   ===================================================================== */
.chapter{position:absolute;top:calc(8% + var(--safe-t));left:0;right:0;display:flex;align-items:center;justify-content:center;gap:calc(var(--u)*3);
  font-family:var(--la);font-style:italic;font-size:calc(var(--u)*3.2);letter-spacing:calc(var(--u)*1);color:var(--gold);opacity:0;transition:color 1.2s}
.chapter i{display:block;width:calc(var(--u)*10);height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
.chapter i:last-child{transform:scaleX(-1)}
#sc-story.night .chapter{color:var(--gold-l)}
.story-text{position:absolute;left:0;right:0;top:40%;transform:translateY(-50%);transition:transform 1.3s var(--ease)}
.story-text.up{transform:translateY(calc(-50% - var(--sh)*.15))}
.line{font-size:calc(var(--u)*6.8);line-height:1.9;font-weight:500;text-align:center;padding:0 calc(var(--u)*8);
  color:var(--burgundy);transition:color 1.2s;text-wrap:balance;text-shadow:0 calc(var(--u)*.3) calc(var(--u)*2) rgba(255,250,242,.6)}
#sc-story.night .line{color:var(--cream);text-shadow:0 0 calc(var(--u)*3) rgba(0,0,0,.45)}
.line.glow{text-shadow:0 0 calc(var(--u)*4) rgba(232,180,90,.6),0 0 calc(var(--u)*1) rgba(255,250,242,.9)}
.caret{display:inline-block;width:.07em;height:1.05em;margin-inline-start:.1em;vertical-align:-.18em;border-radius:2px;
  background:var(--gold);animation:blink .85s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.road{position:absolute;left:50%;top:55%;width:calc(var(--u)*70);margin-left:calc(var(--u)*-35);opacity:0;overflow:visible}
.candle{position:absolute;left:50%;top:57%;width:calc(var(--u)*16);margin-left:calc(var(--u)*-8);opacity:0}
.candle svg{display:block;width:100%;height:auto;overflow:visible}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick 1.6s ease-in-out infinite}
.flame-glow{animation:glowP 2s ease-in-out infinite}
@keyframes flick{0%,100%{transform:scale(1,1) skewX(0)}25%{transform:scale(.92,1.08) skewX(3deg)}50%{transform:scale(1.04,.94) skewX(-2deg)}75%{transform:scale(.96,1.05) skewX(2deg)}}
@keyframes glowP{50%{opacity:.6}}

/* کیک مشترک (از داستان وارد می‌شه و به صحنه پیام می‌ره) */
.cake-layer{position:absolute;z-index:2;left:50%;top:0;width:calc(var(--u)*60);margin-left:calc(var(--u)*-30);opacity:0;transform-origin:50% 0;pointer-events:none}
.cake{display:block;width:100%;height:auto;overflow:visible}
.tw{transform-box:fill-box;transform-origin:center;animation:tw 2.4s ease-in-out infinite}
@keyframes tw{0%,100%{transform:scale(.3) rotate(0);opacity:.2}50%{transform:scale(1) rotate(45deg);opacity:1}}
#stage:not([data-scene="story"]):not([data-scene="msg"]) .cake-layer *{animation-play-state:paused}

/* =====================================================================
   صحنه ۳: پیام صمیمی
   ===================================================================== */
.msg-texts{position:absolute;left:0;right:0;top:49%;height:27%}
.msg-group{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*1.2);padding:0 calc(var(--u)*7)}
.msg-line{font-size:calc(var(--u)*5.8);line-height:1.8;text-align:center;font-weight:400;color:var(--brown);text-wrap:balance}
.msg-line.strong{color:var(--burgundy);font-weight:500}
.msg-line.big{font-size:calc(var(--u)*7.2);font-weight:700;color:var(--burgundy)}
.heart-wrap{position:absolute;left:50%;top:78%;width:max(56px,calc(var(--u)*18));height:max(56px,calc(var(--u)*18));
  transform:translateX(-50%);opacity:0}
.heart-pop{width:100%;height:100%;position:relative}
.heart-btn{position:relative;z-index:1;width:100%;height:100%;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 30%,#FFFAF2,#FFF0D8 70%,#f1d7ae);
  box-shadow:0 0 0 calc(var(--u)*.5) var(--gold),0 calc(var(--u)*1.6) calc(var(--u)*4.5) rgba(128,13,34,.22);transition:background .5s}
.heart-btn svg{width:52%;height:52%;fill:none;stroke:var(--burgundy);stroke-width:1.6;transition:fill .4s,stroke .4s}
.heart-btn:not(.liked) svg{animation:hb 1.4s ease-in-out infinite}
.heart-btn.liked{background:radial-gradient(circle at 35% 30%,#b3253f,#800D22 65%,#5e0918)}
.heart-btn.liked svg{fill:var(--cream);stroke:var(--cream)}
@keyframes hb{0%,100%{transform:scale(1)}14%{transform:scale(1.16)}28%{transform:scale(1)}42%{transform:scale(1.1)}}
.heart-ring{position:absolute;inset:0;border-radius:50%;border:2px solid var(--burgundy);opacity:0;pointer-events:none}

/* =====================================================================
   صحنه ۴: رونمایی
   ===================================================================== */
.box-rays{position:absolute;left:50%;top:40%;width:calc(var(--u)*230);height:calc(var(--u)*230);
  margin:calc(var(--u)*-115) 0 0 calc(var(--u)*-115);opacity:0;pointer-events:none}
.box-rays::before{content:"";position:absolute;inset:0;
  background:repeating-conic-gradient(from 0deg,rgba(255,224,160,.18) 0deg 6deg,transparent 6deg 17deg);
  -webkit-mask:radial-gradient(circle,#000 0%,transparent 58%);mask:radial-gradient(circle,#000 0%,transparent 58%);
  animation:spin 80s linear infinite}
.lite .box-rays::before{animation:none;-webkit-mask:none;mask:none;background:radial-gradient(circle,rgba(255,224,160,.28),transparent 55%)}

.card-pos{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);z-index:3}
.card-zoom{transform:translate3d(0,0,0) scale(1);transition:transform .8s var(--ease)}
#stage.zoomed .card-pos{z-index:9}
#stage.zoomed .card-zoom{transform:translate3d(0,var(--zy,0px),0) scale(var(--zk,1.3))}
.card{position:relative;opacity:0;padding:calc(var(--u)*1.2);border-radius:calc(var(--u)*4.2);cursor:zoom-in;
  background:linear-gradient(145deg,#f8e6bb 0%,#C99A4A 35%,#f3dca6 58%,#a77a33 100%);
  box-shadow:0 calc(var(--u)*4) calc(var(--u)*10) rgba(0,0,0,.5),0 0 calc(var(--u)*12) rgba(232,201,135,.3)}
#stage.zoomed .card{cursor:zoom-out}
.card img{display:block;width:auto;height:auto;max-width:calc(var(--u)*78);max-height:calc(var(--sh)*.5);
  border-radius:calc(var(--u)*3);background:#fff}

<script>
/* =====================================================================
   ⚙️ تنظیمات — فقط این بخش رو تغییر بدید
   ===================================================================== */
const LOGO_IMAGE      = "logo.png";            // فایل لوگو
const LOGO_ROUND      = true;                  // لوگوی گرد
const INSTAGRAM_IMAGE = "instagram-page.jpg";  // اسکرین‌شات پیج اینستاگرام
const MUSIC_FILE      = "";                    // مثلاً "music.mp3" — خالی = جعبه‌موزیک داخلی
const SPEED           = 1;                     // ضریب سرعت کل (۱ = عادی، ۱.۱ = کندتر)

/* متن‌ها */
const TXT = {
  intro: "یه اتفاق شیرین در راهه...",
  cta:   "بازش کنیم؟",
  story: [
    "ما تازه شروع کردیم...",
    "شاید شروع کردن تو این روزها آسون نباشه...",
    "وسط این همه جنگ، گرونی و سختی...",
    "اما هنوز به رویاهای کوچیکمون امید داریم.",
    "تصمیم گرفتیم با عشق، دنیا رو یه ذره شیرین‌تر کنیم."
  ],
  m1: "ما هنوز اول راهیم...",
  m2: "ولی خوشحال می‌شیم کنارمون باشی.",
  m3: "اگه ما رو می‌بینی،",
  m4: "لایک و فالو یادتون نره 🥲❤️",
  brand: "cackloris",
  w1: "به دنیای شیرین ما خوش اومدی ❤️",
  hint: ""
};

/* =====================================================================
   تشخیص توان دستگاه
   ===================================================================== */
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const LITE = REDUCED || (navigator.deviceMemory || 8) <= 3 || (navigator.hardwareConcurrency || 8) <= 4;
if (LITE) document.documentElement.classList.add('lite');

/* =====================================================================
   ابزارهای پایه
   ===================================================================== */
const $ = s => document.querySelector(s);
const stage = $('#stage');
const EASE = 'cubic-bezier(.22,1,.36,1)';
const BOUNCE = 'cubic-bezier(.34,1.4,.64,1)';
let RUN = 0;                 // شناسه اجرا؛ با Replay عوض می‌شه
const CANCEL = {};
let UNIT = 4, SW = 400, SH = 711;
const U = () => UNIT;

/* ساعت قابل توقف: وقتی تب مخفیه، زمان‌بندی داستان هم متوقف می‌شه */
const Clock = (() => {
  let paused = false; const set = new Set();
  function run(t){ t.start = performance.now(); t.id = setTimeout(() => { set.delete(t); t.res(); }, t.rem); }
  function wait(ms){ return new Promise(res => { const t = {rem:Math.max(0, ms), res, start:0, id:0}; set.add(t); if (!paused) run(t); }); }
  function pause(){ if (paused) return; paused = true; const n = performance.now();
    set.forEach(t => { clearTimeout(t.id); t.rem = Math.max(0, t.rem - (n - t.start)); }); }
  function resume(){ if (!paused) return; paused = false; set.forEach(run); }
  function clear(){ set.forEach(t => clearTimeout(t.id)); set.clear(); }
  return {wait, pause, resume, clear};
})();

function sleep(ms){
  const id = RUN;
  return Clock.wait(ms * SPEED).then(() => { if (id !== RUN) throw CANCEL; });
}
/* انیمیشن WAAPI؛ اگه وسطش Replay بشه، ادامه زنجیره قبلی متوقف می‌شه */
function anim(el, kf, o = {}){
  if (!el) return Promise.resolve();
  const id = RUN;
  const opts = Object.assign({duration:1000, easing:EASE, fill:'forwards'}, o);
  opts.duration *= SPEED; if (opts.delay) opts.delay *= SPEED;
  const a = el.animate(kf, opts);
  const p = a.finished.then(() => {}, () => {}).then(() => { if (id !== RUN) throw CANCEL; });
  p.catch(() => {});
  return p;
}
function clearEl(el){
  el.getAnimations().forEach(a => a.cancel());
  el.style.removeProperty('opacity'); el.style.removeProperty('transform'); el.style.removeProperty('filter');
}

/* ---------- اندازه صحنه 9:16 ---------- */
function layout(){
  const W = innerWidth, H = innerHeight;
  let sw, sh;
  if (W / H < 0.62) { sw = W; sh = H; }
  else { sh = H; sw = Math.round(H * 9 / 16); }
  SW = sw; SH = sh; UNIT = sw / 100;
  stage.style.setProperty('--sw', sw + 'px');
  stage.style.setProperty('--sh', sh + 'px');
  stage.style.setProperty('--u', UNIT + 'px');
  FX.resize(sw, sh);
}

function setBg(id){ document.querySelectorAll('.bg').forEach(b => b.classList.toggle('on', b.id === 'bg-' + id)); }
function setScene(id){
  stage.dataset.scene = id;
  document.querySelectorAll('.scene').forEach(s => s.classList.toggle('active', s.id === 'sc-' + id));
}

/* ---------- افکت‌های متن (فقط opacity و transform؛ بدون blur) ---------- */
function splitWords(el, text){
  el.innerHTML = '';
  text.split(' ').forEach((t, i, arr) => {
    const s = document.createElement('span');
    s.className = 'w' + (/^[a-z]/i.test(t) ? ' latin' : '');
    s.textContent = t;
    el.appendChild(s);
    if (i < arr.length - 1) el.appendChild(document.createTextNode(' '));
  });
  return [...el.querySelectorAll('.w')];
}
async function revealWords(el, text, {stagger = 120, dur = 900, y = 2.2, scale = 1} = {}){
  clearEl(el);
  const ws = splitWords(el, text), u = U();
  el.style.opacity = '1';
  ws.forEach((w, i) => anim(w,
    [{opacity:0, transform:`translate3d(0,${y*u}px,0) scale(${scale})`}, {opacity:1, transform:'none'}],
    {duration:dur, delay:i * stagger}));
  await sleep((ws.length - 1) * stagger + dur);
}
/* تایپ (اتصال حروف فارسی حفظ می‌شه) */
async function typeText(el, text, speed = 60){
  clearEl(el);
  el.style.opacity = '1';
  el.innerHTML = '';
  const tn = document.createTextNode(''), caret = document.createElement('span');
  caret.className = 'caret';
  el.append(tn, caret);
  for (const ch of Array.from(text)) {
    tn.data += ch;
    await sleep(ch === ' ' ? speed * 1.5 : (/[.،,]/.test(ch) ? speed * 2.5 : speed));
  }
  await sleep(500);
  caret.remove();
}

/* =====================================================================
   سیستم ذرات سبک: یک حلقه، اسپرایت پیش‌رندر، بدون shadowBlur،
   خودکار متوقف می‌شه وقتی کاری نداره
   ===================================================================== */
const FX = (() => {
  const cv = $('#fx'), ctx = cv.getContext('2d');
  let W = 0, H = 0, s = 1, parts = [], mode = 'none', acc = 0, raf = 0, last = 0, hidden = false;
  const MAX = REDUCED ? 30 : LITE ? 70 : 140;
  const RATE = {gold:LITE ? 4 : 8, sugar:LITE ? 12 : 22, ash:LITE ? 4 : 7, none:0};
  const HEART = new Path2D('M0 6 C-14 -4 -8 -16 0 -8 C8 -16 14 -4 0 6Z');
  const hex = h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
  function sprite(core, edge = core){
    const c = document.createElement('canvas'); c.width = c.height = 32;
    const g = c.getContext('2d'), a = hex(core), b = hex(edge);
    const gr = g.createRadialGradient(16,16,0,16,16,16);
    gr.addColorStop(0, `rgba(${a},1)`); gr.addColorStop(.3, `rgba(${b},.6)`); gr.addColorStop(1, `rgba(${b},0)`);
    g.fillStyle = gr; g.fillRect(0,0,32,32); return c;
  }
  const SP = {
    gold:['#fff3d4','#E8C987','#f7e6bd'].map(c => sprite(c, '#C99A4A')),
    sugar:[sprite('#ffffff', '#d9bf8f')],
    ash:[sprite('#e9d6d0', '#8a5a62')]
  };
  const pick = a => a[Math.random() * a.length | 0];
  const rnd = (a, b) => a + Math.random() * (b - a);

  function resize(w, h){
    const dpr = Math.min(devicePixelRatio || 1, LITE ? 1 : 1.5);
    W = w; H = h; s = w / 400;
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function add(p){ if (parts.length < MAX) parts.push(p); }
  function spawn(){
    if (mode === 'gold') add({k:'dust', img:pick(SP.gold), x:rnd(0,W), y:H + 8, vx:rnd(-6,6)*s, vy:-rnd(14,34)*s, r:rnd(1.4,3.6)*s, life:0, max:rnd(6,10), ph:rnd(0,6)});
    else if (mode === 'sugar') add({k:'fall', img:SP.sugar[0], x:rnd(0,W), y:-8, vx:rnd(-5,5)*s, vy:rnd(18,38)*s, r:rnd(1.1,2.6)*s, life:0, max:rnd(6,10), ph:rnd(0,6), a:.95});
    else if (mode === 'ash') add({k:'fall', img:SP.ash[0], x:rnd(0,W), y:-8, vx:rnd(-4,4)*s, vy:rnd(10,20)*s, r:rnd(1,2.2)*s, life:0, max:rnd(8,12), ph:rnd(0,6), a:.45});
  }
  /* پاشیدن پودر قند روی کل تصویر */
  function sift(n = 50){
    n = Math.round(n * (LITE ? .5 : 1) * (REDUCED ? .3 : 1));
    for (let i = 0; i < n; i++) add({k:'fall', img:SP.sugar[0], x:rnd(0,W), y:rnd(-10, H*.45), vx:rnd(-6,6)*s, vy:rnd(14,30)*s, r:rnd(1,2.6)*s, life:0, max:rnd(4,7), ph:rnd(0,6), a:.95});
    kick();
  }
  function burst(x, y, n = 30, kind = 'spark', spread = 1){
    n = Math.round(n * (LITE ? .5 : 1) * (REDUCED ? .3 : 1));
    for (let i = 0; i < n; i++) {
      const a = rnd(0, Math.PI * 2), sp = rnd(60, 240) * spread * s;
      add({k:kind, img:pick(SP.gold), x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - (kind === 'heart' ? 60*s : 0),
        r:(kind === 'heart' ? rnd(5,10) : rnd(1.2,2.8)) * s, life:0, max:rnd(1.2,2.4),
        c:Math.random() < .6 ? '#9E1A31' : '#C99A4A', rot:rnd(-.5,.5), ph:0});
    }
    kick();
  }
  function floatHearts(n = 10){
    n = Math.round(n * (LITE ? .6 : 1) * (REDUCED ? .3 : 1));
    for (let i = 0; i < n; i++) Clock.wait(i * 200).then(() => {
      add({k:'heart', float:1, x:rnd(W*.1, W*.9), y:H + 20, vx:rnd(-12,12)*s, vy:-rnd(60,100)*s,
        r:rnd(5,11)*s, life:0, max:rnd(5,7.5), c:Math.random() < .65 ? '#9E1A31' : '#C99A4A', rot:rnd(-.4,.4), ph:rnd(0,6)});
      kick();
    });
  }
  function tick(now){
    const dt = Math.min((now - last) / 1000, .05); last = now;
    ctx.clearRect(0, 0, W, H);
    if (mode !== 'none' && !REDUCED) { acc += RATE[mode] * dt; while (acc >= 1) { acc--; spawn(); } }
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i]; p.life += dt;
      const k = p.life / p.max;
      if (k >= 1 || p.y < -40 || p.y > H + 40) { parts[i] = parts[parts.length - 1]; parts.pop(); continue; }
      p.ph += dt * 2;
      let al;
      if (p.k === 'dust') { p.x += (p.vx + Math.sin(p.ph) * 8 * s) * dt; p.y += p.vy * dt; al = Math.sin(k * Math.PI) * .8; }
      else if (p.k === 'fall') { p.x += (p.vx + Math.sin(p.ph) * 10 * s) * dt; p.y += p.vy * dt; al = Math.min(1, k * 6) * (1 - k) * p.a; }
      else if (p.float) { p.x += (p.vx + Math.sin(p.ph) * 18 * s) * dt; p.y += p.vy * dt; al = Math.min(1, k * 8) * (1 - k); }
      else { const d = 1 - 2.4 * dt; p.vx *= d; p.vy = p.vy * d + 90 * s * dt; p.x += p.vx * dt; p.y += p.vy * dt; al = 1 - k; }
      ctx.globalAlpha = al > 0 ? al : 0;
      if (p.k === 'heart') {
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot + Math.sin(p.ph) * .2);
        const sc = p.r / 8; ctx.scale(sc, sc); ctx.fillStyle = p.c; ctx.fill(HEART); ctx.restore();
      } else {
        const d = p.r * 4; ctx.drawImage(p.img, p.x - d / 2, p.y - d / 2, d, d);
      }
    }
    ctx.globalAlpha = 1;
    if (!hidden && (parts.length || (mode !== 'none' && !REDUCED))) raf = requestAnimationFrame(tick);
    else { raf = 0; if (!parts.length) ctx.clearRect(0, 0, W, H); }
  }
  function kick(){ if (!raf && !hidden) { last = performance.now(); raf = requestAnimationFrame(tick); } }
  return {
    resize, burst, sift, floatHearts,
    setAmbient(m){ mode = m; acc = 0; kick(); },
    clear(){ parts.length = 0; acc = 0; ctx.clearRect(0, 0, W, H); },
    pause(){ hidden = true; cancelAnimationFrame(raf); raf = 0; },
    resume(){ hidden = false; kick(); }
  };
})();

/* =====================================================================
   موسیقی (فقط بعد از تعامل کاربر)
   ===================================================================== */
const Music = (() => {
  let ctx, master, timer, audioEl, on = false, step = 0, next = 0;
  const prog = [[60,64,67,72],[57,60,64,69],[53,57,60,65],[55,59,62,67]];
  const f = m => 440 * Math.pow(2, (m - 69) / 12);
  function note(m, t, v = .12, d = 2.4, type = 'sine'){
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.value = f(m);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + d + .1);
  }
  function schedule(){
    if (next < ctx.currentTime) next = ctx.currentTime + .05;
    while (next < ctx.currentTime + .6) {
      const ch = prog[Math.floor(step / 8) % 4], i = step % 8, pat = [0,2,1,3,2,1,3,2];
      note(ch[pat[i]] + 12, next, .07, 2.2);
      if (i === 0) { note(ch[0] - 12, next, .09, 4, 'triangle'); note(ch[1], next, .03, 4); }
      next += .42; step++;
    }
  }
  function start(){
    if (MUSIC_FILE) {
      if (!audioEl) { audioEl = new Audio(MUSIC_FILE); audioEl.loop = true; audioEl.volume = .6; }
      audioEl.play().catch(() => {});
    } else {
      try {
        if (!ctx) {
          ctx = new (window.AudioContext || window.webkitAudioContext)();
          master = ctx.createGain(); master.gain.value = 0;
          const fb = ctx.createDelay(); fb.delayTime.value = .32;
          const fg = ctx.createGain(); fg.gain.value = .3;
          master.connect(ctx.destination); master.connect(fb); fb.connect(fg); fg.connect(fb); fg.connect(ctx.destination);
        }
        ctx.resume(); next = ctx.currentTime + .1;
        master.gain.cancelScheduledValues(ctx.currentTime);
        master.gain.linearRampToValueAtTime(.9, ctx.currentTime + 2);
        clearInterval(timer); timer = setInterval(schedule, 200);
      } catch (e) {}
    }
    on = true; $('#sndBtn').classList.add('playing');
  }
  function stop(){
    if (audioEl) audioEl.pause();
    if (ctx) { master.gain.linearRampToValueAtTime(0, ctx.currentTime + .6); setTimeout(() => { if (!on) clearInterval(timer); }, 700); }
    on = false; $('#sndBtn').classList.remove('playing');
  }
  function suspend(){ clearInterval(timer); if (audioEl) audioEl.pause(); if (ctx) ctx.suspend(); }
  function resume(){ if (!on) return; if (audioEl) audioEl.play().catch(() => {}); if (ctx) { ctx.resume(); clearInterval(timer); timer = setInterval(schedule, 200); } }
  return {start, stop, suspend, resume, toggle:() => on ? stop() : start(), get on(){ return on; }};
})();

  await sleep(1100);
  box.classList.remove('lit');
  anim(box, [{opacity:1, transform:'none'}, {opacity:0, transform:`translate3d(0,${u*26}px,0) scale(.85)`}], {duration:1300, easing:'ease-in'});
  await sleep(700);
  $('#card').classList.add('shine');
  await revealWords($('#brandName'), TXT.brand, {stagger:0, dur:1000, y:2, scale:.9});
  await revealWords($('#w1'), TXT.w1, {stagger:120, dur:900});
  FX.floatHearts(10);
  await sleep(900);
  // تأکید نهایی: کارت کمی بزرگ می‌شه + حلقه طلایی
  await anim($('#card'), [{transform:'none'}, {transform:'scale(1.07)'}], {duration:1200});
  anim($('#cardRing'), [{opacity:.9, transform:'scale(1)'}, {opacity:0, transform:'scale(1.12)'}], {duration:1300, iterations:2, fill:'none'});
  const cc = center($('#card')); FX.burst(cc.x, cc.y, 30, 'spark', 1.1);
  cardReady = true;
  $('#hint').textContent = TXT.hint;
  anim($('#hint'), [{opacity:0}, {opacity:1}], {duration:800});
  await sleep(1500);
  FX.setAmbient('none');
  await anim($('#replayBtn'), [{opacity:0}, {opacity:1}], {duration:800});
  $('#replayBtn').classList.add('ready');
}

/* ---------- زوم نرم عکس پیج (تمام صفحه را نمی‌گیرد) ---------- */
function setZoom(on){
  if (on && !cardReady) return;
  if (on) {
    const r = $('#card').getBoundingClientRect(), s = stage.getBoundingClientRect();
    const k = Math.max(1, Math.min(1.4, (SW * .9) / r.width * 1.07, (SH * .8) / r.height * 1.07));
    const cy = r.top - s.top + r.height / 2;
    stage.style.setProperty('--zk', k.toFixed(3));
    stage.style.setProperty('--zy', (SH * .5 - cy).toFixed(1) + 'px');
  }
  stage.classList.toggle('zoomed', on);
}
$('#card').addEventListener('click', () => setZoom(!stage.classList.contains('zoomed')));
$('#zoomDim').addEventListener('click', () => setZoom(false));

/* =====================================================================
   کنترل تایم‌لاین
   ===================================================================== */
async function playStory(){
  try {
    await openIntro();
    await sceneStory();
    await sceneMsg();
    await sceneReveal();
  } catch (e) { if (e !== CANCEL) console.warn(e); }
}

/* ریست کامل برای اجرای مجدد */
function resetAll(){
  RUN++;
  Clock.clear();
  stage.getAnimations({subtree:true}).forEach(a => {
    const css = (typeof CSSAnimation !== 'undefined' && a instanceof CSSAnimation) || (typeof CSSTransition !== 'undefined' && a instanceof CSSTransition);
    if (!css) a.cancel();
  });
  ['#introText','#storyLine','#m1','#m2','#m3','#m4','#brandName','#w1','#hint'].forEach(s => { const e = $(s); e.innerHTML = ''; clearEl(e); });
  ['#introStage','#brandTop','#iBoxWrap','#ctaWrap','#chapter','#road','#roadPath','#candle','#warm','#cakeLayer',
   '#msgG1','#msgG2','#heartWrap','#heartPop','#heartBtn','#card','#cardRing','#boxRays','#replayBtn','#flash']
    .forEach(s => clearEl($(s)));
  document.querySelectorAll('.gbox, .gbox *').forEach(clearEl);
  $('#introStage').style.removeProperty('transform-origin');
  ['#iBox','#rBox'].forEach(s => $(s).classList.remove('lit','idle'));
  $('#heartBtn').classList.remove('liked');
  $('#card').classList.remove('shine');
  $('#sc-story').classList.remove('night');
  $('#storyLine').classList.remove('glow');
  $('#storyText').classList.remove('up');
  $('#ctaWrap').classList.remove('ready');
  $('#replayBtn').classList.remove('ready');
  stage.classList.remove('dark','zoomed');
  cardReady = false;
  FX.clear();
}

let started = false;
$('#startBtn').addEventListener('click', e => {
  if (started) return; started = true;
  const btn = e.currentTarget, r = btn.getBoundingClientRect();
  const rp = document.createElement('span'); rp.className = 'ripple';
  const size = Math.max(r.width, r.height) * 2;
  rp.style.cssText = `width:${size}px;height:${size}px;left:${e.clientX - r.left - size/2}px;top:${e.clientY - r.top - size/2}px`;
  btn.appendChild(rp);
  rp.animate([{transform:'scale(0)', opacity:.8}, {transform:'scale(1)', opacity:0}], {duration:650, easing:'ease-out'}).onfinish = () => rp.remove();
  if (musicWanted) Music.start();
  $('#ctaWrap').classList.remove('ready');
  playStory();
});

$('#replayBtn').addEventListener('click', () => {
  if (!$('#replayBtn').classList.contains('ready')) return;
  resetAll();
  flash('rgba(255,240,216,1)', 1200);
  started = false;
  sceneIntro().catch(() => {});
});

$('#heartBtn').addEventListener('click', likeHeart);
$('#sndBtn').addEventListener('click', e => { e.stopPropagation(); Music.toggle(); musicWanted = Music.on; });

/* کلیدهای میانبر: H = حالت فیلم‌برداری تمیز، R = اجرای مجدد، M = صدا، Esc = بستن زوم */
addEventListener('keydown', e => {
  const k = (e.key || '').toLowerCase();
  if (k === 'h') document.body.classList.toggle('clean');
  if (k === 'r') { $('#replayBtn').classList.add('ready'); $('#replayBtn').click(); }
  if (k === 'm') $('#sndBtn').click();
  if (k === 'escape') setZoom(false);
});

/* ---------- پارالاکس سبک (فقط دسکتاپ با ماوس؛ بدون حلقه دائمی) ---------- */
if (matchMedia('(hover:hover) and (pointer:fine)').matches && !REDUCED) {
  const els = [...document.querySelectorAll('.px')];
  let tx = 0, ty = 0, pending = false;
  addEventListener('pointermove', e => {
    tx = (e.clientX / innerWidth - .5) * 2; ty = (e.clientY / innerHeight - .5) * 2;
    if (pending) return; pending = true;
    requestAnimationFrame(() => {
      pending = false;
      els.forEach(el => { const d = +el.dataset.depth || 10; el.style.transform = `translate3d(${-tx * d}px,${-ty * d}px,0)`; });
    });
  }, {passive:true});
}

/* ---------- بارگذاری تصاویر با جایگزین ---------- */
(() => {
  const li = $('#logoImg');
  if (LOGO_ROUND) $('#logoWrap').classList.add('round');
  li.onerror = () => { li.style.display = 'none'; $('#logoFallback').style.display = 'flex'; };
  li.src = LOGO_IMAGE;
  const ii = $('#instaImg');
  ii.onerror = () => { ii.style.display = 'none'; $('#instaFallback').style.display = 'flex'; };
  ii.src = INSTAGRAM_IMAGE;
})();

/* ---------- توقف همه‌چیز وقتی تب مخفی است ---------- */
let pausedAnims = [];
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    Clock.pause(); FX.pause(); Music.suspend();
    pausedAnims = document.getAnimations().filter(a => a.playState === 'running');
    pausedAnims.forEach(a => a.pause());
  } else {
    pausedAnims.forEach(a => { try { a.play(); } catch (e) {} }); pausedAnims = [];
    Clock.resume(); FX.resume(); Music.resume();
  }
});

/* ---------- شروع ---------- */
let rzT = 0;
addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(() => { layout(); if (stage.classList.contains('zoomed')) setZoom(true); }, 150); });
$('#ctaLabel').textContent = TXT.cta;
layout();
sceneIntro().catch(() => {});
</script>
</body>
